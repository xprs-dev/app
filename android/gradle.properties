# Build-JVM ceilings for ANY machine that builds this app — CI included.
#
# Deliberately modest, because the Dart AOT compiler is a separate ~1.1GB
# process running alongside this JVM: a generous ceiling is not headroom, it is
# two processes competing for the same RAM. But modest is not tiny. This file
# is read by GitHub Actions as well as by a developer box, and it must be a
# ceiling that COMPILES everywhere.
#
# It briefly was not. -Xmx1g together with in-process Kotlin put the Kotlin
# compiler inside a 1GB heap and :app:compileReleaseKotlin died on CI with an
# InvocationTargetException — the shape a Kotlin worker OOM takes, with no
# "OutOfMemory" anywhere in the log. Those numbers were tuned for one 16GB
# laptop running earlyoom, which is a fact about that machine and not about
# this project.
#
# A machine that needs a tighter squeeze puts it in ~/.gradle/gradle.properties,
# which OVERRIDES this file (see CLAUDE.md). That is where the laptop's 1g heap,
# in-process Kotlin and 2 workers live, and they still apply there.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
