# Build-JVM ceilings. Deliberately modest: the Dart AOT compiler is a separate
# ~1.1GB process that runs alongside this JVM, and on a 16GB developer box with
# earlyoom configured to kill builds first, a generous ceiling here is not
# headroom -- it is what makes the build the biggest target on the machine and
# gets it shot mid-flight. Raise only with a measurement that says you must.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin inside the Gradle JVM rather than a third one of its own.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
