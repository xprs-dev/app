<!doctype html>
<!-- The hotspot chat page. SOURCE OF TRUTH: edit this file, then regenerate
     chat_page.c with tool/embed_page.py. Theme and logo font are the old
     the XPRS chat (xprs_http/chat_page.c), bubbles lean Telegram.
     Identity is created silently on first visit; the menu lets a user show
     the npub, export the nsec, import another, or start fresh. The crypto
     is the XPRS 9.1.2 short-Schnorr, validated against the spec's worked
     example. Everything inline: captive WebViews have no internet, no
     secure context, often no localStorage. -->

:root{--accent:#ffa86a;--bg:#101010;--text:#f0f0f0;
      --border:rgba(255,240,224,.125);--muted:#888}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;
     display:flex;flex-direction:column}
.header{border-bottom:1px solid var(--border);height:40px;
        padding:0 12px;margin-top:5px;
        display:flex;align-items:center;gap:12px;position:relative}
.header .logo{font-family:'Wartext',sans-serif;font-size:38px;
        color:var(--accent);letter-spacing:5px;margin-top:-12px;
        transform:scaleY(.72);transform-origin:center}
.menu{margin-left:auto;position:relative}
.my-callsign{color:var(--accent);font-size:12px;font-weight:bold;
        margin-right:8px}
.menu-btn{background:transparent;border:1px solid var(--border);
        color:var(--text);padding:6px 8px;border-radius:4px;cursor:pointer;
        font-size:16px;line-height:1}
.menu-panel{position:absolute;right:0;top:38px;background:#151515;
        border:1px solid var(--border);border-radius:6px;min-width:200px;
        display:none;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.menu-panel.open{display:block}
.menu-panel button{width:100%;background:transparent;border:0;
        color:var(--text);padding:10px 12px;text-align:left;cursor:pointer;
        font-size:13px}
.menu-panel button:hover{background:rgba(255,255,255,.06)}
#content{flex:1;display:flex;min-height:0}
#side{width:150px;border-right:1px solid var(--border);overflow-y:auto;
      padding:8px 0;flex-shrink:0}
#side .room{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--muted);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#side .room.on{color:var(--accent);border-left:2px solid var(--accent);
      background:rgba(255,168,106,.06)}
#side .roomhead{padding:8px 12px 2px;font-size:10px;color:#555;
      text-transform:uppercase;letter-spacing:1px}
#chatcol{flex:1;display:flex;flex-direction:column;min-width:0}
/* Width alone. With the viewport resizing for the keyboard, a phone held
   upright is briefly wider than tall, and an orientation test flipped the
   page into the desktop rail mid-sentence. */
@media (max-width:640px){
  /* #chatwrap is the row that holds the rail and the chat column, so it is
   * the one that has to stack. Turning only #content into a column left the
   * room chips beside the conversation, squeezing the composer to a sliver. */
  #content,#chatwrap{flex-direction:column}
  /* Stacked, the chat column is a column-flex CHILD, and min-height:auto
   * lets it grow to its messages: a long conversation pushed the composer
   * off the bottom of the screen. Zero lets .messages scroll instead. */
  #chatwrap,#chatcol{min-height:0}
  #side{width:auto;border-right:0;border-bottom:1px solid var(--border);
        display:flex;overflow-x:auto;overflow-y:hidden;padding:4px 8px;
        gap:4px;align-items:center}
  #side .roomhead{display:none}
  #side .room{padding:5px 10px;border:1px solid var(--border);
        border-radius:12px;flex-shrink:0}
  #side .room.on{border-color:var(--accent);border-left-width:1px}
}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;
        flex-direction:column;gap:8px}
/* A short conversation sits above the composer, where the eye already is,
   not at the top of an empty screen. margin-top:auto rather than
   justify-content:flex-end, which stops a column from scrolling. */
.messages>:first-child{margin-top:auto}
.msg{max-width:85%}
.msg .meta{font-size:11px;margin-bottom:2px}
.msg .meta.under{margin-bottom:0;margin-top:2px}
.msg .dots{background:transparent;border:0;color:var(--muted);
        cursor:pointer;font-size:13px;padding:0 5px}
.msg .likes{color:#e0708a;font-size:11px;margin-left:6px}
#msgmenu{position:fixed;background:#151515;border:1px solid var(--border);
        border-radius:6px;z-index:20;display:none;min-width:170px;
        box-shadow:0 8px 20px rgba(0,0,0,.35)}
#msgmenu button{width:100%;background:transparent;border:0;color:var(--text);
        padding:10px 12px;text-align:left;cursor:pointer;font-size:13px}
#msgmenu button:hover{background:rgba(255,255,255,.06)}
.msg .quote{font-size:11px;color:var(--muted);border-left:2px solid
        var(--accent);padding:2px 6px;margin-bottom:3px;text-align:left}
#replybar{display:none;border-top:1px solid var(--border);padding:4px 12px;
        font-size:11px;color:var(--muted);background:#161310;
        align-items:center;gap:8px}
#replybar.on{display:flex}
#replybar .x{margin-left:auto;background:transparent;border:0;
        color:var(--muted);cursor:pointer;font-size:14px}
.msg .author{color:var(--accent);font-weight:bold}
.msg .time{color:var(--muted);margin-left:6px}
.msg .bubble{display:inline-block;background:#1b1b1b;
        border:1px solid var(--border);border-radius:12px;
        padding:8px 12px;word-wrap:break-word;text-align:left;
        max-width:100%}
.msg.local{align-self:flex-end;text-align:right}
.msg.local .bubble{background:#2a1c10;border-color:rgba(255,168,106,.35);
        border-bottom-right-radius:4px}
.msg.remote{align-self:flex-start;text-align:left}
.msg.remote .bubble{border-bottom-left-radius:4px}
.badge{display:inline-block;font-size:9px;font-weight:bold;
        padding:1px 5px;border-radius:3px;margin-left:6px}
.badge.ok{background:#1b5e20;color:#81c784}
.badge.bad{background:#b71c1c;color:#ef9a9a}
.msg.failed .bubble{opacity:.55;border-style:dashed}
.msg .why{font-size:11px;color:#ef9a9a;margin-top:2px}
.mood{font-size:10px;font-style:italic;color:var(--accent);margin-left:4px}
.input-area{border-top:1px solid var(--border);padding:8px;display:flex;
        gap:6px;align-items:center}
.input-area input{flex:1;min-width:0;background:transparent;
        border:1px solid var(--border);border-radius:4px;padding:8px;
        color:var(--text);font-size:16px;outline:none}
.input-area input:focus{border-color:var(--accent)}
.input-area button{flex-shrink:0;font-family:'Wartext',sans-serif;
        font-size:18px;font-weight:bold;background:var(--accent);
        color:var(--bg);border:none;border-radius:4px;padding:4px 12px;
        cursor:pointer}
.status-bar{padding:4px 12px;font-size:10px;color:var(--muted);
        display:flex;justify-content:space-between}
.status-bar a{color:var(--muted)}
#getapp.hide{display:none}
.snackbar{visibility:hidden;min-width:250px;background:#333;color:#fff;
        text-align:center;border-radius:4px;padding:12px;position:fixed;
        z-index:10;left:50%;bottom:60px;transform:translateX(-50%);
        font-size:14px}
.snackbar.show{visibility:visible;animation:fadein .3s,fadeout .3s 2.7s}
/* Tabs. The station shows seven panels on its own screen; the phone on the
   hotspot gets the same material in five, chat first because that is what
   somebody who just joined an open AP came for. */
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{flex:1 0 auto;background:none;border:0;color:var(--muted);
  font:inherit;font-size:12px;padding:7px 12px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 12px;
  font-size:13px;overflow-wrap:break-word;-webkit-overflow-scrolling:touch}
.view.hide,#chatwrap.hide{display:none}
#chatwrap{flex:1;display:flex;min-height:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:#555;font-weight:normal;font-size:10px;
  text-transform:uppercase;padding:3px 8px 3px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:4px 8px 4px 0;border-bottom:1px solid #1c1c1c;
  vertical-align:top;word-break:break-word}
.tbl td.n{white-space:nowrap;color:var(--muted)}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{padding:3px 8px 3px 0;border-bottom:1px solid #1c1c1c}
.kv td:first-child{color:var(--muted);white-space:nowrap;width:42%}
.wform{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.wform input{flex:1 1 140px;min-width:0;background:transparent;color:var(--text);
  border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:14px}
.wform button{background:none;border:1px solid var(--border);color:var(--text);
  border-radius:4px;padding:6px 12px}
.kv tr.net{cursor:pointer}
h3{font-size:11px;color:#555;text-transform:uppercase;font-weight:normal;
  margin:14px 0 5px}
h3:first-child{margin-top:0}
.bar{height:9px;background:var(--accent);min-width:1px}
.bars{display:flex;align-items:flex-end;gap:1px;height:52px;margin:3px 0 2px}
.bars div{flex:1 1 0;background:var(--accent);min-height:1px}
.dim{color:var(--muted)}
.sig-verified{color:#3a3}.sig-unverified{color:#a83}.sig-none{color:#555}
.wire{font-family:monospace;font-size:10px;color:#666;
  overflow-wrap:anywhere;margin-top:2px}
.pkt{border-bottom:1px solid #1c1c1c;padding:6px 0}
.pkt .l1{display:flex;align-items:baseline;gap:4px;font-size:13px}
.pkt .l1 .when{margin-left:auto;color:var(--muted);font-size:11px;
  white-space:nowrap;padding-left:6px}
.pkt .l2{font-size:11px;color:var(--muted)}
.btag{display:inline-block;margin:2px 3px 0 0;padding:0 5px;border-radius:8px;
  border:1px solid var(--border);font-size:10px;line-height:16px;white-space:nowrap}
.btag.sent{color:var(--accent);border-color:var(--accent)}
.viewbtns button{background:none;border:1px solid var(--border);color:var(--muted);
  font:inherit;font-size:11px;padding:2px 7px;margin-right:4px;cursor:pointer}
.viewbtns button.on{color:var(--accent);border-color:var(--accent)}
img.shot{max-width:100%;image-rendering:pixelated;border:1px solid var(--border)}
@keyframes fadein{from{bottom:0;opacity:0}to{bottom:60px;opacity:1}}
@keyframes fadeout{from{bottom:60px;opacity:1}to{bottom:0;opacity:0}}

<script>
"use strict";
// XPRS crypto for the hotspot chat page: sha256, secp256k1 (native BigInt),
// the section 9.1.2 short-Schnorr, base85 and bech32. No dependencies -- a
// captive-portal WebView has no secure context and no WebCrypto.subtle.

// ---- sha256 (bytes in, bytes out) ----
function sha256(data){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=data.length, buf=new Uint8Array(((l+9+63)>>6)<<6);
  buf.set(data); buf[l]=0x80;
  var bl=l*8;
  buf[buf.length-4]=(bl>>>24)&255; buf[buf.length-3]=(bl>>>16)&255;
  buf[buf.length-2]=(bl>>>8)&255; buf[buf.length-1]=bl&255;
  var w=new Array(64);
  for(var off=0;off<buf.length;off+=64){
    for(var i=0;i<16;i++) w[i]=(buf[off+4*i]<<24)|(buf[off+4*i+1]<<16)|(buf[off+4*i+2]<<8)|buf[off+4*i+3];
    for(i=16;i<64;i++){
      var a1=w[i-15], b1=w[i-2];
      var s0=((a1>>>7)|(a1<<25))^((a1>>>18)|(a1<<14))^(a1>>>3);
      var s1=((b1>>>17)|(b1<<15))^((b1>>>19)|(b1<<13))^(b1>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      var ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+K[i]+w[i])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var mj=(a&b)^(a&c)^(b&c);
      var t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out=new Uint8Array(32);
  for(i=0;i<8;i++){out[4*i]=(H[i]>>>24)&255;out[4*i+1]=(H[i]>>>16)&255;out[4*i+2]=(H[i]>>>8)&255;out[4*i+3]=H[i]&255;}
  return out;
}

// ---- byte/bigint helpers ----
function b2n(b){var v=0n;for(var i=0;i<b.length;i++)v=(v<<8n)|BigInt(b[i]);return v;}
function n2b(v,len){var out=new Uint8Array(len);for(var i=len-1;i>=0;i--){out[i]=Number(v&255n);v>>=8n;}return out;}
function cat(){var n=0,i,a=arguments;for(i=0;i<a.length;i++)n+=a[i].length;
  var out=new Uint8Array(n),o=0;for(i=0;i<a.length;i++){out.set(a[i],o);o+=a[i].length;}return out;}
function s2b(s){var out=new Uint8Array(s.length);for(var i=0;i<s.length;i++)out[i]=s.charCodeAt(i)&255;return out;}
function hex(b){var s='';for(var i=0;i<b.length;i++)s+=('0'+b[i].toString(16)).slice(-2);return s;}

// ---- secp256k1 (Jacobian double-and-add; one-shot signing, speed is fine) ----
var P=2n**256n-2n**32n-977n;
var N=0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
var GX=0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n;
var GY=0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8n;
function mod(a,m){var r=a%m;return r<0n?r+m:r;}
function powmod(b,e,m){var r=1n;b=mod(b,m);while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n;}return r;}
function inv(a,m){return powmod(mod(a,m),m-2n,m);}
// Jacobian points [X,Y,Z]; infinity Z=0
function jdbl(p){var X=p[0],Y=p[1],Z=p[2];if(Z===0n)return p;
  var A=X*X%P,B=Y*Y%P,C=B*B%P;
  var D=mod(2n*((X+B)*(X+B)%P-A-C),P);
  var E=3n*A%P,F=E*E%P;
  var X3=mod(F-2n*D,P);
  return [X3,mod(E*(D-X3)-8n*C,P),mod(2n*Y*Z,P)];}
function jadd(p,q){if(p[2]===0n)return q;if(q[2]===0n)return p;
  var Z1Z1=p[2]*p[2]%P,Z2Z2=q[2]*q[2]%P;
  var U1=p[0]*Z2Z2%P,U2=q[0]*Z1Z1%P;
  var S1=p[1]*Z2Z2%P*q[2]%P,S2=q[1]*Z1Z1%P*p[2]%P;
  if(U1===U2)return S1===S2?jdbl(p):[0n,1n,0n];
  var H=mod(U2-U1,P),I=4n*H*H%P,J=H*I%P,r=mod(2n*(S2-S1),P),V=U1*I%P;
  var X3=mod(r*r-J-2n*V,P);
  return [X3,mod(r*(V-X3)-2n*S1*J,P),mod(2n*H*p[2]%P*q[2],P)];}
function jmul(k,px,py){var r=[0n,1n,0n],q=[px,py,1n];
  while(k>0n){if(k&1n)r=jadd(r,q);q=jdbl(q);k>>=1n;}return r;}
function jaff(p){if(p[2]===0n)return null;var zi=inv(p[2],P),zi2=zi*zi%P;
  return [p[0]*zi2%P,p[1]*zi2%P*zi%P];}
function mulG(k){return jaff(jmul(mod(k,N),GX,GY));}

// ---- tagged hash: sha256(sha256(tag)||sha256(tag)||msg) ----
function tagged(tag,msg){var th=sha256(s2b(tag));return sha256(cat(th,th,msg));}

// ---- XPRS short-Schnorr (9.1.2) ----
/* The packet's bytes are UTF-8 (section 4), not the low byte of each UTF-16
 * unit: s2b is for the ASCII it was written for (tags, hex), and signing "e
 * with an accent" through it hashed different bytes than every verifier does. */
function u8(s){
  if(typeof TextEncoder!=='undefined')return new TextEncoder().encode(s);
  var u=unescape(encodeURIComponent(s)),b=new Uint8Array(u.length);
  for(var i=0;i<u.length;i++)b[i]=u.charCodeAt(i);return b;}
function xprsSign(canonicalStr,dPriv,aux){
  var digest=sha256(u8(canonicalStr));
  var d=mod(dPriv,N); if(d===0n) throw 'bad key';
  var Pt=mulG(d);
  if(Pt[1]&1n){d=N-d;Pt=mulG(d);}
  var px=n2b(Pt[0],32);
  var k=b2n(tagged('XPRS/nonce',cat(n2b(d,32),digest,aux)));
  k=mod(k,N); if(k===0n)k=1n;
  var R=mulG(k);
  var rx=n2b(R[0],32);
  var e32=tagged('XPRS/challenge',cat(rx,px,digest));
  var e=b2n(e32.slice(0,16));
  var s=mod(k+e*d,N);
  return cat(e32.slice(0,16),n2b(s,32));
}

// ---- base85, the spec alphabet ----
var B85='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-+=^!/*?&<>()[]%$#@,;_';
function b85enc(bytes){var out='';
  for(var i=0;i<bytes.length;i+=4){
    var v=(bytes[i]*16777216)+(bytes[i+1]*65536)+(bytes[i+2]*256)+bytes[i+3];
    var d=['','','','',''];
    for(var j=4;j>=0;j--){d[j]=B85[v%85];v=Math.floor(v/85);}
    out+=d.join('');}
  return out;}

// ---- bech32 (npub/nsec) ----
var BC='qpzry9x8gf2tvdw0s3jn54khce6mua7l';
function bcPolymod(vals){var GEN=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];
  var chk=1;for(var i=0;i<vals.length;i++){var top=chk>>25;chk=((chk&0x1ffffff)<<5)^vals[i];
  for(var j=0;j<5;j++)if((top>>j)&1)chk^=GEN[j];}return chk;}
function bcHrpExpand(hrp){var out=[];var i;for(i=0;i<hrp.length;i++)out.push(hrp.charCodeAt(i)>>5);
  out.push(0);for(i=0;i<hrp.length;i++)out.push(hrp.charCodeAt(i)&31);return out;}
function bech32Encode(hrp,data5){var vals=bcHrpExpand(hrp).concat(data5);
  var pm=bcPolymod(vals.concat([0,0,0,0,0,0]))^1;var chk='';
  for(var i=0;i<6;i++)chk+=BC[(pm>>(5*(5-i)))&31];
  var s=hrp+'1';for(i=0;i<data5.length;i++)s+=BC[data5[i]];return s+chk;}
function bech32Decode(str){str=str.toLowerCase();var pos=str.lastIndexOf('1');
  if(pos<1||pos+7>str.length)return null;
  var hrp=str.slice(0,pos),data=[];
  for(var i=pos+1;i<str.length;i++){var d=BC.indexOf(str[i]);if(d<0)return null;data.push(d);}
  if(bcPolymod(bcHrpExpand(hrp).concat(data))!==1)return null;
  return {hrp:hrp,data:data.slice(0,-6)};}
function to5(bytes){var out=[],acc=0,bits=0;
  for(var i=0;i<bytes.length;i++){acc=(acc<<8)|bytes[i];bits+=8;
    while(bits>=5){bits-=5;out.push((acc>>bits)&31);}}
  if(bits>0)out.push((acc<<(5-bits))&31);return out;}
function to8(data5){var out=[],acc=0,bits=0;
  for(var i=0;i<data5.length;i++){acc=(acc<<5)|data5[i];bits+=5;
    while(bits>=8){bits-=8;out.push((acc>>bits)&255);}}
  return new Uint8Array(out);}
function npubEncode(pubx){return bech32Encode('npub',to5(pubx));}
function nsecEncode(priv){return bech32Encode('nsec',to5(priv));}
function nsecDecode(str){var d=bech32Decode(str);
  if(!d||d.hrp!=='nsec')return null;var b=to8(d.data);
  return b.length===32?b:null;}

// ---- identity helpers ----
// X1: a person (XPRS.md section 3). X3 is a fixed station, which is what
// the board serving this page is, not the person typing into it.
function callsignFromNpub(npub){var s='X1';
  for(var i=5;i<9;i++)s+=npub[i].toUpperCase();return s;}
function pubkeyX(privBytes){var Pt=mulG(b2n(privBytes));return n2b(Pt[0],32);}


// Sealed bodies for the web chat (XPRS.md 6.2): AES-256-CBC with PKCS#7
// padding under the X coordinate of (our scalar x their public point), the
// vector first, base64url without padding. Pure JS because a page served over
// plain HTTP has no WebCrypto.subtle. Uses the curve helpers of xprs_crypto.js
// (P, powmod, jmul, jaff, b2n, n2b, cat), which come before it in the build.

// ---- AES-256 (FIPS 197), one block at a time ----
var AES_SBOX=null,AES_INV=null,AES_RCON=[1,2,4,8,16,32,64,128,27,54];
function aesTables(){
  if(AES_SBOX)return;
  AES_SBOX=new Uint8Array(256);AES_INV=new Uint8Array(256);
  var p=1,q=1,x;
  do{
    p=p^((p<<1)&255)^(p&128?27:0);               /* p *= 3 */
    q^=q<<1;q^=q<<2;q^=q<<4;q&=255;if(q&128)q^=9; /* q /= 3 */
    x=q^((q<<1|q>>7)&255)^((q<<2|q>>6)&255)^((q<<3|q>>5)&255)^((q<<4|q>>4)&255);
    AES_SBOX[p]=(x^99)&255;AES_INV[(x^99)&255]=p;
  }while(p!==1);
  AES_SBOX[0]=99;AES_INV[99]=0;
}
function xt(a){return((a<<1)^(a&128?27:0))&255;}
function gmul(a,b){var r=0;while(b){if(b&1)r^=a;a=xt(a);b>>=1;}return r;}
function aesExpand(key){
  aesTables();
  var w=new Uint8Array(240),i,t0,t1,t2,t3,k;
  w.set(key);
  for(i=8;i<60;i++){
    t0=w[4*i-4];t1=w[4*i-3];t2=w[4*i-2];t3=w[4*i-1];
    if(i%8===0){k=t0;t0=AES_SBOX[t1]^AES_RCON[i/8-1];t1=AES_SBOX[t2];t2=AES_SBOX[t3];t3=AES_SBOX[k];}
    else if(i%8===4){t0=AES_SBOX[t0];t1=AES_SBOX[t1];t2=AES_SBOX[t2];t3=AES_SBOX[t3];}
    w[4*i]=w[4*i-32]^t0;w[4*i+1]=w[4*i-31]^t1;w[4*i+2]=w[4*i-30]^t2;w[4*i+3]=w[4*i-29]^t3;
  }
  return w;
}
function aesBlock(w,s,enc){
  var r,i,a,b,c,d,t=new Uint8Array(16);
  function addKey(round){for(var j=0;j<16;j++)s[j]^=w[round*16+j];}
  if(enc){
    addKey(0);
    for(r=1;r<=14;r++){
      for(i=0;i<16;i++)s[i]=AES_SBOX[s[i]];
      /* ShiftRows */
      t.set(s);
      s[1]=t[5];s[5]=t[9];s[9]=t[13];s[13]=t[1];
      s[2]=t[10];s[6]=t[14];s[10]=t[2];s[14]=t[6];
      s[3]=t[15];s[7]=t[3];s[11]=t[7];s[15]=t[11];
      if(r<14)for(i=0;i<16;i+=4){
        a=s[i];b=s[i+1];c=s[i+2];d=s[i+3];
        s[i]=xt(a)^xt(b)^b^c^d;s[i+1]=a^xt(b)^xt(c)^c^d;
        s[i+2]=a^b^xt(c)^xt(d)^d;s[i+3]=xt(a)^a^b^c^xt(d);
      }
      addKey(r);
    }
  }else{
    addKey(14);
    for(r=13;r>=0;r--){
      /* InvShiftRows */
      t.set(s);
      s[1]=t[13];s[5]=t[1];s[9]=t[5];s[13]=t[9];
      s[2]=t[10];s[6]=t[14];s[10]=t[2];s[14]=t[6];
      s[3]=t[7];s[7]=t[11];s[11]=t[15];s[15]=t[3];
      for(i=0;i<16;i++)s[i]=AES_INV[s[i]];
      addKey(r);

           root:(p&&p.root)||(p&&p.r)||'',
           from:p?p.from:id, snip:p?p.text.slice(0,40):''};
  document.getElementById('replyinfo').textContent=
    'Replying to '+replyTo.from+': '+replyTo.snip;
  document.getElementById('replybar').className='on';
  document.getElementById('txt').focus();}
function cancelReply(){
  replyTo=null;
  document.getElementById('replybar').className='';}

/* New-message notice: a short beep (WebAudio -- no secure context needed,
 * but it must be unlocked by a user gesture), a title counter cleared on
 * focus, and a vibration where the device has one. */
var sndOn=stGet('xprs_sound')!=='0';
var audioCtx=null,unread=0,baseTitle=document.title;
function unlockAudio(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
document.addEventListener('click',unlockAudio);
document.addEventListener('keydown',unlockAudio);
function beep(){
  if(!sndOn||!audioCtx)return;
  try{
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.15);
  }catch(e){}}
function notice(){
  beep();
  if(navigator.vibrate)try{navigator.vibrate(80);}catch(e){}
  if(document.hidden||!document.hasFocus()){
    unread++;document.title='('+unread+') '+baseTitle;}}
window.addEventListener('focus',function(){
  unread=0;document.title=baseTitle;});
function toggleSound(){
  sndOn=!sndOn;stSet('xprs_sound',sndOn?'1':'0');
  document.getElementById('sndbtn').textContent='Sound: '+(sndOn?'on':'off');
  toggleMenu();}

/* ---- likes (XPRS 6.5): add:like / remove:like on a message's id ---- */
var likes={};        /* msgId -> {callsign:1} */
var domById={};      /* msgId -> bubble meta element to refresh */
var myLikes={};      /* msgId -> 1 (mine, for toggling) */
function likeCount(id){var n=0;for(var k in likes[id]||{})n++;return n;}
function refreshLikes(id){
  var el=domById[id];if(!el)return;
  var n=likeCount(id);
  el.textContent=n?('\u2665 '+n):'';}
function applyReaction(row){
  var w=row.wire||'';
  var rm=w.match(/ r:([0-9a-f]{6})/);
  if(!rm)return;
  var id=rm[1],from=baseCall(row.from||'');
  if(!likes[id])likes[id]={};
  if(/ add:like/.test(w)){likes[id][from]=1;}
  else if(/ remove:like/.test(w)){delete likes[id][from];}
  if(from===baseCall(mycall))myLikes[id]=/ add:like/.test(w)?1:0;
  refreshLikes(id);}
function sendLike(id){
  var verb=myLikes[id]?'remove':'add';
  myLikes[id]=verb==='add'?1:0;
  if(!likes[id])likes[id]={};
  if(verb==='add')likes[id][baseCall(mycall)]=1;
  else delete likes[id][baseCall(mycall)];
  refreshLikes(id);
  var par=idmap[id];
  var sc=par&&par.scope&&par.scope!=='global'?' scope:'+par.scope:'';
  signAny('t:reaction f:'+mycall+' ts:'+tsNow()+sc+' '+verb+':like r:'+id,function(wire){
    if(wire)postWire(wire,null);});}

/* ---- the per-message menu ---- */
function showMsgMenu(ev,id,from,own){
  var m=document.getElementById('msgmenu');
  var items='<button onclick="menuAct(\'reply\',\''+id+'\',\''+from+'\')">Reply</button>'+
    '<button onclick="menuAct(\'like\',\''+id+'\',\''+from+'\')">'+
      (myLikes[id]?'Unlike':'Like \u2665')+'</button>';
  if(!own)items+='<button onclick="menuAct(\'dm\',\''+id+'\',\''+from+'\')">Message '+from+'</button>';
  m.innerHTML=items;
  m.style.display='block';
  var x=Math.min(ev.clientX,window.innerWidth-180);
  var y=Math.min(ev.clientY,window.innerHeight-140);
  m.style.left=x+'px';m.style.top=y+'px';
  ev.stopPropagation();}
document.addEventListener('click',function(){
  document.getElementById('msgmenu').style.display='none';});
function menuAct(act,id,from){
  document.getElementById('msgmenu').style.display='none';
  if(act==='reply')startReply(id);
  else if(act==='like')sendLike(id);
  else if(act==='dm')openDm(from);}

var clearedBefore=parseInt(stGet('xprs_cleared')||'0',10)||0;

/* Rooms (XPRS.md 9.11): Local is the scope:local conversation, kept to
 * Bluetooth, ESP-NOW and the LAN; Regional is scope:regional, which adds
 * LoRa and radio and never reaches the internet; Global is the default
 * scope, which goes anywhere. A room is the scope its author wrote, never
 * the bearer that delivered it, and a packet the station heard out of range
 * (row.out) is in none of them. A packet with d: naming a person is a 1:1
 * and gets its own room. */
var curRoom=stGet('xprs_room')||'local';
var allRows=[];              /* every row heard, for room switches */
var dmPeers={};              /* callsign -> true */
function baseCall(c){var i=c.indexOf('-');return i<0?c:c.slice(0,i);}
/* The scope word before m:, as the room it files into. An unknown lowercase
 * word is in no room: a station does not pass it on (9.11). */
function scopeRoom(w){
  var m=w.split(' m:')[0].match(/ scope:(\S+)/);
  if(!m||m[1]==='global')return 'global';
  if(m[1]==='local'||m[1]==='regional')return m[1];
  return /[a-z]/.test(m[1])?null:'global';      /* PT,ES: a country */
}
function roomOf(row){
  var w=row.wire||'';
  var to=row.to||'';
  if(row.out)return null;
  /* A status (27) is a feed post, not a conversation: its own timeline. */
  if((row.type||'')==='status'||w.indexOf('t:status ')===0)return 'social';
  if(to&&to[0]!=='#'){
    if(baseCall(to)===baseCall(mycall))return 'dm:'+baseCall(row.from);
    if(baseCall(row.from)===baseCall(mycall))return 'dm:'+baseCall(to);
    return null;             /* somebody else's 1:1: not our room */
  }
  return scopeRoom(w);
}
function roomLabel(r){
  return r==='local'?'Local':r==='regional'?'Regional':r==='global'?'Global':
         r==='social'?'Social':r.slice(3);}
function renderSide(){
  var el=document.getElementById('side');
  var htmlp='<div class="roomhead">Rooms</div>';
  var rooms=['local','regional','global'];
  var peers=Object.keys(dmPeers).sort();
  var extra=peers.length?'<div class="roomhead">People</div>':'';
  el.innerHTML=htmlp+
    rooms.map(function(r){return '<div class="room'+(curRoom===r?' on':'')+
      '" data-r="'+r+'">'+roomLabel(r)+'</div>';}).join('')+
    '<div class="roomhead">Feed</div>'+
    '<div class="room'+(curRoom==='social'?' on':'')+
      '" data-r="social">Social</div>'+
    extra+
    peers.map(function(p){var r='dm:'+p;
      return '<div class="room'+(curRoom===r?' on':'')+
      '" data-r="'+r+'">'+p+'</div>';}).join('');
  var items=el.getElementsByClassName('room');
  for(var i=0;i<items.length;i++)
    items[i].onclick=(function(r){return function(){switchRoom(r);};})(
      items[i].getAttribute('data-r'));
}
function switchRoom(r){
  curRoom=r;stSet('xprs_room',r);
  cancelReply();
  seen={};
  document.getElementById('msgs').innerHTML='';
  renderSide();
  for(var i=0;i<allRows.length;i++)render(allRows[i]);
  document.getElementById('txt').placeholder=
    r==='local'?'Message (stays local)':
    r==='regional'?'Message (stays regional)':
    r==='global'?'Message (goes everywhere)':
    r==='social'?'Status update (published to everyone)':
    'Message to '+r.slice(3);
}
/* Draw the room again from what was heard (a key arrived, so what was held
 * back can now be opened). */
function rerender(){
  seen={};
  document.getElementById('msgs').innerHTML='';
  for(var i=0;i<allRows.length;i++)render(allRows[i]);
}
function openDm(call){
  var p=baseCall(call);
  if(p===baseCall(mycall))return;
  dmPeers[p]=true;
  switchRoom('dm:'+p);
}
function render(row){
  var w=row.wire||'';
  if((row.type||'')==='reaction'||w.indexOf('t:reaction ')===0){
    var rk=wireId(w);
    if(!seen[rk]){seen[rk]=1;applyReaction(row);}
    return;
  }
  var room=roomOf(row);
  if(room===null)return;
  if(room.slice(0,3)==='dm:')dmPeers[room.slice(3)]=true;
  if(allRows.indexOf(row)<0)allRows.push(row);
  if(room!==curRoom){renderSide();return;}
  /* One bubble per message (XPRS.md 5): copies that came round by other
   * relays differ only in via:, which the identifier leaves out. */
  var sk=wireId(w);
  if(seen[sk])return;
  var mi=w.indexOf(' m:');
  var text=mi>=0?w.slice(mi+3):'';
  var sealed=false;
  if(row.plain!=null){text=row.plain;sealed=!!row.sealed;}
  else if(mi<0){
    /* x: is a body sealed to one key (6.2): open it with the peer's. */
    var xm=w.match(/ x:(\S+)/);
    if(xm&&canSign()){
      var other=baseCall(row.from===mycall?(row.to||''):row.from);
      var k=keys[other];
      if(!k){
        /* Ask again only after a while if the last lookup found nothing. */
        if(other&&!(keyMiss[other]&&Date.now()-keyMiss[other]<10000))
          fetchKey(other,function(kk){if(kk)rerender();});
        return;               /* drawn again when the key arrives */
      }
      if(extMode){
        /* The extension opens it, asynchronously: drawn when it has. */
        var pc=plainCache[sk];
        if(pc===undefined){
          plainCache[sk]=null;
          nostrOpen(hex(k),xm[1],function(t2){plainCache[sk]=t2===null?false:t2;rerender();});
          return;
        }
        if(pc===null)return;
        text=pc===false?null:pc;
      }else text=openBody(priv,k,xm[1]);
      if(text===null)text='(a sealed message that could not be opened)';
      sealed=true;
    }
  }
  seen[sk]=1;
  if(!text)return;
  if(clearedBefore&&(row.ts||0)<clearedBefore)return;   /* user hit Clear */
  var own=row.from===mycall;
  var id=wireId(w);
  var rm=w.match(/ r:([0-9a-f]{6})/);
  var rootm=w.match(/ root:([0-9a-f]{6})/);
  idmap[id]={from:row.from,text:text,r:rm?rm[1]:'',
             root:rootm?rootm[1]:'',
             scope:scopeRoom(w)||'global'};
  var d=document.createElement('div');
  d.className='msg '+(own?'local':'remote');
  var when=row.ts?new Date(row.ts*1000).toLocaleTimeString():'';
  var badge=row.sig==='verified'?'<span class="badge ok">signed</span>'
           :(row.sig==='none'?'<span class="badge bad">unsigned</span>':'');
  if(sealed)badge+='<span class="badge ok">sealed</span>';
  /* mood: (27.1) is decoration: one italic word beside the post. */
  var mm=w.match(/ mood:([a-z]+) /);
  if(mm)badge+='<span class="mood">'+mm[1]+'</span>';
  var extras='<span class="likes"></span>'+
    '<button class="dots" title="Message options">&#8942;</button>';
  if(own){
    d.innerHTML='<div class="bubble"></div>'+
      '<div class="meta under"><span class="time">'+when+'</span>'+badge+extras+'</div>';
  }else{
    d.innerHTML='<div class="meta"><span class="author"></span>'+
      '<span class="time">'+when+'</span>'+badge+extras+'</div>'+
      '<div class="bubble"></div>';
    var au=d.querySelector('.author');
    au.textContent=row.from;
    au.style.cursor='pointer';
    au.title='Message '+row.from+' directly';
    au.onclick=function(){openDm(row.from);};
    notice();   /* somebody else spoke: beep, vibrate, count in the title */
  }
  domById[id]=d.querySelector('.likes');
  refreshLikes(id);
  d.querySelector('.dots').onclick=function(ev){
    showMsgMenu(ev,id,row.from,own);};
  var bub=d.querySelector('.bubble');
  if(rm){
    /* A receiver that never heard the parent still shows the reply,
     * marked as answering a message it does not hold (6.4). */
    var par=idmap[rm[1]];
    var q=document.createElement('div');
    q.className='quote';
    q.textContent=par?(par.from+': '+par.text.slice(0,60))
                     :('replying to '+rm[1]);
    bub.appendChild(q);
  }
  bub.appendChild(document.createTextNode(text));
  /* In the order things were SAID. The archive files a packet when it is
   * heard, and the mesh replays: a catch-up brings an hour-old message in
   * after this morning's, and appending put 14:05 below 13:28. A row with
   * no time goes last, like a message being sent right now. */
  var box=document.getElementById('msgs');
  var t=row.ts||0;
  d.setAttribute('data-ts',t||9e9);
  var at=null,kids=box.children;
  if(t)for(var j=kids.length-1;j>=0;j--){
    if(+kids[j].getAttribute('data-ts')<=t){at=kids[j].nextSibling;break;}
    at=kids[j];}
  var stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
  box.insertBefore(d,at);
  if(stick||own)box.scrollTop=box.scrollHeight;
  return d;
}
function clearChat(){
  toggleMenu();
  clearedBefore=Math.floor(Date.now()/1000);
  stSet('xprs_cleared',''+clearedBefore);
  seen={};
  document.getElementById('msgs').innerHTML='';
  snack('Chat view cleared');
}
var chatLoaded=false;
/* Each room's archive, asked for by room (room=, spec/API-HTTP.md), once
 * per page. The newest 200 of everything is one room on a busy station:
 * a bridged Meshtastic channel alone filled it, and Local and Global showed
 * nothing although the station held their conversations. One room at a
 * time, chained: the station has one HTTP worker. A station that does not
 * know room= answers its newest messages, which render() files as usual. */
var roomsBackfilled=false;
function backfillRooms(){
  if(roomsBackfilled)return;
  roomsBackfilled=true;
  var asks=[['local','message'],['regional','message'],['global','message'],
            ['social','status']];
  (function next(i){
    if(i>=asks.length)return;
    var a=asks[i];
    getJSON('/api/xprs/history?kind='+a[1]+'&room='+a[0]+'&limit=100'+
            (sess?'&session='+sess:''),function(d){
      var rows=(d&&d.rows||[]).slice().reverse();
      for(var j=0;j<rows.length;j++)render(rows[j]);
      next(i+1);
    });
  })(0);
}
function load(){
  try{
    var x=new XMLHttpRequest();
    // The whole conversation once, then only the newest: this runs every three
    // seconds, and every read holds the archive against its writer.
    x.open('GET','/api/xprs/history?kind=message,reaction,status&limit='+
           (chatLoaded?40:200)+(sess?'&session='+sess:''),true);
    x.timeout=4000;
    x.onload=function(){
      try{
        var d=JSON.parse(x.responseText);
        chatLoaded=true;
        var rows=(d.rows||[]).slice().reverse();
        setTimeout(backfillRooms,0);
        for(var i=0;i<rows.length;i++){
          var t=rows[i].type||'';
          if(t==='message'||t==='reaction'||t==='status')render(rows[i]);
        }
        document.getElementById('stat').textContent=
          (d.held!==undefined?d.held+' packets held':'ok');
      }catch(e){}
    };
    x.send();
  }catch(e){}
}

// ---- the other four tabs -------------------------------------------------
//
// Everything here is read-only and comes from the endpoints the station
// already answers, so the phone on the hotspot sees what the board's own
// screen shows: who is in reach (the Reachable panel), what went past
// (Traffic), the three series (Stats), and the device itself.
//
// Only the visible tab polls, and each at the rate its data actually
// changes. The station has one HTTP worker and one 2 KB buffer for every
// reply; four phones polling five endpoints each would be the whole budget
// spent on nobody looking.
var tab='chat', tabTimer=null;
var TAB_MS={chat:3000,traffic:5000,devices:5000,stats:60000,station:10000,settings:5000};

function el(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ago(sec){
  sec=Math.max(0,Math.round(sec));
  if(sec<60)return sec+'s';
  if(sec<3600)return Math.round(sec/60)+'m';
  if(sec<86400)return Math.round(sec/3600)+'h';
  return Math.round(sec/86400)+'d';
}
// Words, not a stopwatch: the two largest non-zero units. "168h" is not an
// uptime anybody reads, and this row has the width for "1 day, 3 hours".
function plur(n,w){return n+' '+w+(n==1?'':'s');}
function hms(sec){
  var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),
      m=Math.floor(sec%3600/60),s=Math.floor(sec%60);
  if(d)return h?plur(d,'day')+', '+plur(h,'hour'):plur(d,'day');
  if(h)return m?plur(h,'hour')+', '+m+' min':plur(h,'hour');
  if(m)return m+' min, '+s+' s';
  return s+' s';
}
// The same shape for "how much battery is left", which is a duration too.
function left(sec){
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return h?h+'h '+(m<10?'0':'')+m+'m':m+'m';
}
function kb(n){
  if(n==null)return '-';
  return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
}
function getJSON(url,cb){
  try{
    var x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=6000;
    x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){cb(null);}};
    x.onerror=x.ontimeout=function(){cb(null);};
    x.send();
  }catch(e){cb(null);}
}
function fail(id,what){
  el(id).innerHTML='<p class="dim">'+esc(what)+' unavailable on this station.</p>';
}

function showTab(t){
  tab=t;
  var bs=el('tabs').getElementsByTagName('button');
  for(var i=0;i<bs.length;i++)
    bs[i].className=bs[i].getAttribute('data-tab')===t?'on':'';
  el('chatwrap').className=t==='chat'?'':'hide';
  var views=['traffic','devices','stats','station','settings'];
  for(var j=0;j<views.length;j++)
    el('v-'+views[j]).className='view'+(views[j]===t?'':' hide');
  if(tabTimer)clearInterval(tabTimer);
  tick();
  tabTimer=setInterval(tick,TAB_MS[t]||10000);
}
function tick(){
  if(tab==='chat')load();
  else if(tab==='traffic')loadTraffic();
  else if(tab==='devices')loadDevices();
  else if(tab==='stats')loadStats();
  else if(tab==='station')loadStation();
  else if(tab==='settings')loadSettings();
}
// Stats, Station and Settings live behind the menu, not in the tab row.
function openView(t){toggleMenu();showTab(t);}

// Traffic: every packet the station filed, not only the ones chat shows.
//
// One entry per packet. The archive files a copy for every bearer a packet
// left or arrived on, and a station on BLE, ESP-NOW, LoRa and the LAN showed
// the same message four to ten times with only the bearer changed. Copies
// are the same packet by the XPRS.md 5 identifier (wireId: via: and sig:
// left out), so they merge into one entry whose tags say where it went
// ("sent") and where it came from ("heard"), the loudest signal per bearer.
//
// Stacked rows rather than a table: six columns and a raw wire do not fit
// 390 px, and a page that scrolls sideways on a phone is the wrong answer.
function trafficGroups(rows){
  var order=[],by={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i],k=wireId(r.wire||'');
    var g=by[k];
    if(!g){g=by[k]={row:r,ts:r.ts||0,own:!!r.own,tags:{},tagOrder:[]};order.push(g);}
    if((r.ts||0)>g.ts)g.ts=r.ts;
    if(r.own)g.own=true;
    if(r.sig==='verified'||(r.sig==='unverified'&&g.row.sig==='none'))g.row=r;
    var t=(r.own?'sent':'heard')+'|'+(r.bearer||'?');
    var tg=g.tags[t];
    if(!tg){tg=g.tags[t]={dir:r.own?'sent':'heard',bearer:r.bearer||'?',
                          rssi:0,n:0};g.tagOrder.push(t);}
    tg.n++;
    if(r.rssi&&(!tg.rssi||r.rssi>tg.rssi))tg.rssi=r.rssi;
  }
  return order;
}
function loadTraffic(){
  getJSON('/api/xprs/history?limit=120',function(d){
    if(!d||!d.rows)return fail('v-traffic','History');
    var h='',now=Math.floor(Date.now()/1000);
    var gs=trafficGroups(d.rows);
    for(var i=0;i<gs.length&&i<60;i++){
      var g=gs[i],r=g.row,tags='';
      for(var j=0;j<g.tagOrder.length;j++){
        var tg=g.tags[g.tagOrder[j]];
        tags+='<span class="btag '+tg.dir+'" title="'+tg.dir+' on '+
              esc(tg.bearer)+(tg.n>1?', '+tg.n+' copies':'')+'">'+
              (tg.dir==='sent'?'&uarr;':'&darr;')+esc(tg.bearer)+
              (tg.rssi?' '+esc(tg.rssi):'')+'</span>';
      }
      h+='<div class="pkt"><div class="l1">'+
         '<b>'+esc(r.from||'?')+'</b>'+
         (g.own?' <span class="dim">(us)</span>':'')+
         ' <span class="dim">&rarr;</span> '+esc(r.to||'all')+
         '<span class="when">'+(g.ts?esc(ago(now-g.ts)):'-')+'</span></div>'+
         '<div class="l2">'+esc(r.type||'')+
         ' &middot; <span class="sig-'+esc(r.sig||'none')+'">'+
         esc(r.sig||'none')+'</span> '+tags+'</div>'+
         '<div class="wire">'+esc(r.wire||'')+'</div></div>';
    }
    el('v-traffic').innerHTML=(d.held!==undefined?
      '<p class="dim">'+d.held+' packets held on this station</p>':'')+h;
  });
}

// Devices: the Reachable panel, same list, same five-minute window.
function loadDevices(){
  getJSON('/api/xprs/devices',function(d){
    if(!d||!d.devices)return fail('v-devices','The heard-station list');
    if(!d.devices.length){
      el('v-devices').innerHTML='<p class="dim">Nobody in range. '+
        'Heard '+(d.heard||0)+' packets since boot.</p>';
      return;
    }
    var h='<table class="tbl"><tr><th>Call</th><th>Link</th><th>Signal</th>'+
          '<th>Distance</th><th>Heard</th></tr>';
    for(var i=0;i<d.devices.length;i++){
      var v=d.devices[i];
      h+='<tr><td>'+esc(v.call)+(v.hops?' <span class="dim">+'+v.hops+
         ' hop'+(v.hops>1?'s':'')+'</span>':'')+'</td>'+
         '<td class="n">'+esc(v.bearer)+'</td>'+
         '<td class="n">'+(v.rssi?esc(v.rssi)+' dBm':'-')+'</td>'+
         '<td class="n">'+(v.dist_m>=0?'~'+esc(v.dist_m)+' m':'-')+'</td>'+
         '<td class="n">'+esc(ago(v.age_s))+' ago</td></tr>';
    }
    h+='</table><p class="dim">Distance is estimated from signal strength '+
       'and is only as good as the room. '+(d.heard||0)+' packets heard '+
       'since boot.</p>';
    el('v-devices').innerHTML=h;
  });
}

// Stats: the same three series the Stats panel charts.
var statsView=0;
function setStatsView(v){statsView=v;loadStats();}
function bars(vals){
  var max=1;
  for(var i=0;i<vals.length;i++)if(vals[i]>max)max=vals[i];
  var h='<div class="bars">';
  for(var j=0;j<vals.length;j++)
    h+='<div style="height:'+Math.max(1,Math.round(vals[j]/max*100))+'%" '+
       'title="'+vals[j]+'"></div>';
  return h+'</div><p class="dim">peak '+max+'</p>';
}
function loadStats(){
  getJSON('/api/stats?view='+statsView,function(d){
    if(!d||!d.devices)return fail('v-stats','Statistics');
    var names=['10 minutes','hour','day'];
    var h='<div class="viewbtns">';
    for(var i=0;i<3;i++)
      h+='<button class="'+(i===statsView?'on':'')+'" '+
         'onclick="setStatsView('+i+')">per '+names[i]+'</button>';
    h+='</div>';
    if(!d.points){
      h+='<p class="dim">Nothing banked yet &mdash; the station buckets by '+
         'wall clock and has no time yet.</p>';
    }else{
      h+='<h3>Devices heard</h3>'+bars(d.devices)+
         '<h3>Packets received</h3>'+bars(d.rx)+
         '<h3>Packets sent</h3>'+bars(d.tx)+
         '<p class="dim">'+d.points+' buckets of '+
         (d.bucket_s>=86400?'a day':d.bucket_s>=3600?'an hour':'ten minutes')+
         ', oldest first.</p>';
    }
    el('v-stats').innerHTML=h;
  });
}

// Station: what the This-device and Settings panels say, plus the screen.
function row(k,v){return '<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>';}
function loadStation(){
  getJSON('/api/status',function(d){
    if(!d)return fail('v-station','Station status');
    var h='<h3>Station</h3><table class="kv">'+
      row('Callsign',esc(d.callsign||''))+
      row('Board',esc(d.board||''))+
      row('Uptime',esc(hms(d.uptime_s||0)))+
      row('Free memory',esc(kb(d.heap_free)))+
      row('Clock',d.time&&d.time.synced?
          esc(new Date(d.time.epoch*1000).toISOString().slice(0,19)
              .replace('T',' '))+' UTC':'<span class="dim">not synced</span>');
    if(d.battery&&d.battery.mv>0){
      // esc() on everything from the wire, exactly as this row did before
      // it grew fields: the surrounding string is raw HTML by design (see
      // the 'Address' row) and that only stays safe while the values are
      // escaped.
      var b=d.battery,t=(b.pct>=0?esc(b.pct)+'%':'')+
            (b.secs_left>0?' \u00b7 about '+esc(left(b.secs_left))+' left':'')+
            ' \u00b7 '+esc(b.mv)+' mV \u00b7 '+esc(b.state);
      // What the gauge has NOT learned is worth a line: a percentage with no
      // discharge behind it is a curve's opinion, and saying so is the
      // difference between a gauge and a decoration.
      if(!b.cycles) t+=' <span class="dim">(voltage only)</span>';
      else if(b.confidence<100)
        t+=' <span class="dim">('+esc(b.cycles)+' cycle'+(b.cycles==1?'':'s')+
           ' learned)</span>';
      if(b.saving) t+=' <span class="dim">\u00b7 saving power</span>';
      h+=row('Battery',t);
    }
    if(d.net)
      h+=row('Address',d.net.ip?esc(d.net.ip):'<span class="dim">hotspot only</span>')+
         row('Internet',d.net.internet==null?'<span class="dim">unknown</span>':
             (d.net.internet?'reachable':'no'));
    if(d.heard!==undefined)
      h+=row('Heard',esc(d.heard)+' packets, '+esc(d.in_reach||0)+' in reach now');
    if(d.indexer)
      h+=row('Archive',esc(d.indexer.count)+' packets held');
    h+='</table>';
    if(d.lora){
      h+='<h3>LoRa</h3><table class="kv">'+
        row('Region',esc(d.lora.region||''))+
        row('Frequency',(d.lora.freq_hz/1e6).toFixed(3)+' MHz')+
        row('Airtime left',Math.round(d.lora.free_ms/1000)+' s of '+
            Math.round(d.lora.duty_ms/1000)+' s this hour')+
        row('Waiting',esc(d.lora.held)+' packets')+'</table>';
    }
    el('v-station').innerHTML=h+'<div id="st-more"></div>';
    getJSON('/api/services',function(sv){
      if(!sv||!sv.features)return;
      var f=sv.features,k,h2='<h3>Roles</h3><table class="kv">';
      for(k in f)h2+=row(k,f[k]?'on':'<span class="dim">off</span>');
      h2+='</table>';
      if(sv.serve&&sv.serve.length)
        h2+='<p class="dim">Announced to others: '+esc(sv.serve.join(', '))+'</p>';
      h2+='<h3>Screen</h3><img class="shot" alt="the station screen" '+
          'src="/api/screen?t='+Date.now()+'" '+
          'onerror="this.parentNode.removeChild(this)">';
      var m=el('st-more'); if(m)m.innerHTML=h2;
    });
  });
}

// ---- settings: the internet WiFi. Any visitor may add a network; none can
// be removed (docs/esp32.md). Built once and only updated after, so a
// refresh never closes a phone's keyboard or moves a field being typed in.
function loadSettings(){
  var v=el('v-settings');
  if(!el('wf-st')){
    v.innerHTML='<h3>Internet WiFi</h3><table class="kv" id="wf-st"></table>'+
      '<h3>Join a network</h3><div class="wform">'+
      '<button onclick="wifiScan()" id="wf-scan">Search</button></div>'+
      '<table class="kv" id="wf-nets"></table>'+
      '<div class="wform"><input id="wf-ssid" maxlength="32" placeholder="Network name"'+
      ' autocomplete="off" autocapitalize="off"><input id="wf-pass" type="password"'+
      ' maxlength="63" placeholder="Password" autocomplete="off">'+
      '<button onclick="wifiJoin()">Join</button></div><p class="dim" id="wf-msg"></p>';
  }
  wifiShow();
}
function wifiShow(){
  getJSON('/api/wifi',function(w){
    var t=el('wf-st');
    if(!w||!t)return;
    var k=w.known||[],names=[];
    for(var i=0;i<k.length;i++)
      names.push(esc(k[i].ssid)+(k[i].internet?'':' <span class="dim">(no internet)</span>'));
    t.innerHTML=row('Network',w.ssid?esc(w.ssid):'<span class="dim">none</span>')+
      row('Connected',w.up?(w.internet?'yes, with internet':w.internet===false?
          'yes, no internet':'yes'):'no')+
      row('Remembered',names.length?names.join(', '):'<span class="dim">none yet</span>');
    var m=el('wf-msg');
    if(w.join==='joining')m.textContent='Joining…';
    else if(w.join==='failed')m.textContent='Could not join'+(w.why?': '+w.why:'')+'.';
    else if(w.join==='joined')m.textContent='Joined.';
  });
}
var scanTries=0;
function wifiScan(){
  el('wf-scan').disabled=true;
  el('wf-nets').innerHTML=row('','Searching…');
  var x=new XMLHttpRequest();
  x.open('POST','/api/wifi/scan');
  x.onload=function(){scanTries=0;setTimeout(scanPoll,2500);};
  x.onerror=function(){el('wf-scan').disabled=false;
    el('wf-nets').innerHTML=row('','No answer. Try again.');};
  x.send('');
}
function scanPoll(){
  getJSON('/api/wifi/scan',function(r){
    if(r&&r.state==='scanning'&&++scanTries<10){setTimeout(scanPoll,1000);return;}
    el('wf-scan').disabled=false;
    var t=el('wf-nets');
    if(!r||r.state!=='done'){
      t.innerHTML=row('','The search did not finish'+(r&&r.why?': '+esc(r.why):'')+'.');
      return;
    }
    var n=r.nets||[],h='';
    if(!n.length)h=row('','No networks in range.');
    for(var i=0;i<n.length;i++){
      var bars=n[i].rssi>-60?'strong':n[i].rssi>-75?'good':'weak';
      h+='<tr class="net" data-i="'+i+'"><td>'+esc(n[i].ssid)+'</td><td>'+bars+
         (n[i].open?', open':'')+(n[i].known?', remembered':'')+'</td></tr>';
    }
    t.innerHTML=h;
    var rows=t.getElementsByTagName('tr');
    for(var j=0;j<rows.length;j++)rows[j].onclick=(function(net){return function(){
      el('wf-ssid').value=net.ssid;
      el('wf-pass').value='';
      if(net.open)el('wf-msg').textContent='Open network: press Join.';
      else el('wf-pass').focus();
    };})(n[+rows[j].getAttribute('data-i')]);
  });
}
function wifiJoin(){
  var s=el('wf-ssid').value,p=el('wf-pass').value,m=el('wf-msg');
  if(!s)return;
  m.textContent='Sending…';
  var x=new XMLHttpRequest();
  x.open('POST','/api/wifi');
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  x.onload=function(){
    var j=null;
    try{j=JSON.parse(x.responseText);}catch(e){}
    if(j&&j.ok){el('wf-pass').value='';m.textContent='Joining…';}
    else m.textContent='Not taken'+(j&&j.error?': '+j.error:'')+'.';
  };
  // A join can take the hotspot off its channel for a moment.
  x.onerror=function(){m.textContent='No answer. Reload in a minute.';};
  x.send('ssid='+encodeURIComponent(s)+'&pass='+encodeURIComponent(p));
}

// ---- what this station offers --------------------------------------------
//
// One page serves every kind of station. A station that lists `page` in
// /api/services says which panels it can fill and whether it hands out the
// app (`app`: the path of its download page); one that does not (the boards,
// today) shows everything, as it always has.
function applyServices(sv){
  var p=sv&&sv.page;
  if(!p)return;
  if(p.session){canSession=true;ensureSession(0);}
  var tabs=p.tabs||['chat'];
  var bs=document.querySelectorAll('[data-tab],[data-view]'),i,n;
  for(i=0;i<bs.length;i++){
    n=bs[i].getAttribute('data-tab')||bs[i].getAttribute('data-view');
    if(tabs.indexOf(n)<0)bs[i].style.display='none';
  }
  if(p.app){el('getapp').href=p.app;el('getapp').className='';}
}

// ---- boot: an identity exists before the first keystroke ----
(function(){
  var saved=stGet('xprs_nsec');
  var b=saved?nsecDecode(saved):null;
  useKey(b||randKey());
  renderSide();
  switchRoom(curRoom);
  load();
  tabTimer=setInterval(tick,TAB_MS.chat);
  getJSON('/api/services',applyServices);
  /* An extension injects `window.nostr` a moment after the page starts. */
  var tries=0,tm=setInterval(function(){
    showExtButton();
    if(nostrAvailable()&&stGet('xprs_ext')==='1'&&!extMode){clearInterval(tm);useExtension(true);}
    else if(++tries>12||(nostrAvailable()&&stGet('xprs_ext')!=='1'))clearInterval(tm);
  },250);
})();
