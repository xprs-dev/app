function openNewDm(){if(tab!=='chat')showTab('chat');switchRoom('dmnew');}
function startDm(){
  var v=(el('dm-to').value||'').trim();
  if(!v)return;
  if(/^npub1/i.test(v)){
    var k=npubDecode(v.toLowerCase());
    if(!k)return snack('That is not a valid npub');
    var c=callsignFromNpub(npubEncode(k));
    keys[c]=k;            /* the npub is the key: no lookup needed */
    return openDm(c);
  }
  v=v.toUpperCase();
  if(!/^[A-Z0-9]{3,12}(-[A-Z0-9]{1,3})?$/.test(v))return snack('A callsign or an npub, please');
  fetchKey(v,function(k){
    if(!k)snack('No key heard for '+v+' yet: messages to them go in clear text until it is');
    openDm(v);
  });
}
/* A callsign shown in a panel, as a link that opens a private message. */
function callLink(c){
  c=esc(c);
  return baseCall(c)===baseCall(mycall)?'<span class="call">'+c+'</span>':
    '<span class="call link" title="Private message" onclick="openDm(\''+c+'\')">'+c+'</span>';
}
function render(row){
  var w=row.wire||'';
  if((row.type||'')==='reaction'||w.indexOf('t:reaction ')===0){
    var rk=wireId(w);
    if(!seen[rk]){seen[rk]=1;applyReaction(row);}
    return;
  }
  var room=roomOf(row);
  if(room===null)return;
  if(room.slice(0,3)==='dm:'){dmPeers[room.slice(3)]=true;countDm(room.slice(3),row);}
  if(allRows.indexOf(row)<0)allRows.push(row);
  if(room!==curRoom){renderSide();return;}
  /* One bubble per message (XPRS.md 5): copies that came round by other
   * relays differ only in via:, which the identifier leaves out. */
  var sk=wireId(w);
  if(seen[sk])return;
  if(room.slice(0,3)==='dm:'&&baseCall(row.to||'')===baseCall(mycall)&&
     baseCall(row.from)!==baseCall(mycall))ackOnce(row,sk);
  var mi=w.indexOf(' m:');
  var text=mi>=0?w.slice(mi+3):'';
  var sealed=false;
  if(row.plain!=null){text=row.plain;sealed=!!row.sealed;}
  else if(mi<0){
    /* x: is a body sealed to one key (6.2): open it with the peer's. */
    var xm=w.match(/ x:(\S+)/);
    if(xm&&canSign()){
      var other=baseCall(row.from===mycall?(row.to||''):row.from);
      var k=keys[other];
      if(!k){
        /* Ask again only after a while if the last lookup found nothing. */
        if(other&&!(keyMiss[other]&&Date.now()-keyMiss[other]<10000))
          fetchKey(other,function(kk){if(kk)rerender();});
        return;               /* drawn again when the key arrives */
      }
      if(extMode){
        /* The extension opens it, asynchronously: drawn when it has. */
        var pc=plainCache[sk];
        if(pc===undefined){
          plainCache[sk]=null;
          nostrOpen(hex(k),xm[1],function(t2){plainCache[sk]=t2===null?false:t2;rerender();});
          return;
        }
        if(pc===null)return;
        text=pc===false?null:pc;
      }else text=openBody(priv,k,xm[1]);
      if(text===null)text='(a sealed message that could not be opened)';
      sealed=true;
    }
  }
  seen[sk]=1;
  if(!text)return;
  if(modRemoved[sk]||(modAway[baseCall(row.from||'')]&&!SAFETY[row.type]))return;
  if(clearedBefore&&(row.ts||0)<clearedBefore)return;   /* user hit Clear */
  var own=row.from===mycall;
  var id=wireId(w);
  var rm=w.match(/ r:([0-9a-f]{6})/);
  var rootm=w.match(/ root:([0-9a-f]{6})/);
  idmap[id]={from:row.from,text:text,r:rm?rm[1]:'',
             root:rootm?rootm[1]:'',
             scope:scopeRoom(w)||'global'};
  var d=document.createElement('div');
  d.className='msg '+(own?'local':'remote');
  d.setAttribute('data-id',id);
  d.setAttribute('data-from',baseCall(row.from||''));
  var when=row.ts?clockOf(row.ts):'';
  var badge=row.sig==='verified'?'<span class="badge ok">signed</span>'
           :(row.sig==='none'?'<span class="badge bad">unsigned</span>':'');
  if(sealed)badge+='<span class="badge ok">sealed</span>';
  /* mood: (27.1) is decoration: one italic word beside the post. */
  var mm=w.match(/ mood:([a-z]+) /);
  if(mm)badge+='<span class="mood">'+mm[1]+'</span>';
  var extras='<span class="likes"></span>'+
    '<button class="dots" title="Message options">&#8942;</button>';
  if(own){
    d.innerHTML='<div class="bubble"></div>'+
      '<div class="meta under"><span class="time" title="'+(row.ts?esc(new Date(row.ts*1000).toLocaleString()):'')+'">'+when+'</span>'+badge+extras+'</div>';
  }else{
    d.innerHTML='<div class="meta"><span class="author"></span>'+
      '<span class="time" title="'+(row.ts?esc(new Date(row.ts*1000).toLocaleString()):'')+'">'+when+'</span>'+badge+extras+'</div>'+
      '<div class="bubble"></div>';
    var au=d.querySelector('.author');
    au.textContent=row.from;
    au.style.cursor='pointer';
    au.title='Message '+row.from+' directly';
    au.onclick=function(){openDm(row.from);};
    notice();   /* somebody else spoke: beep, vibrate, count in the title */
  }
  domById[id]=d.querySelector('.likes');
  refreshLikes(id);
  d.querySelector('.dots').onclick=function(ev){
    showMsgMenu(ev,id,row.from,own);};
  var bub=d.querySelector('.bubble');
  if(rm){
    /* A receiver that never heard the parent still shows the reply,
     * marked as answering a message it does not hold (6.4). */
    var par=idmap[rm[1]];
    var q=document.createElement('div');
    q.className='quote';
    q.textContent=par?(par.from+': '+par.text.slice(0,60))
                     :('replying to '+rm[1]);
    bub.appendChild(q);
  }
  bub.appendChild(document.createTextNode(text));
  /* In the order things were SAID. The archive files a packet when it is
   * heard, and the mesh replays: a catch-up brings an hour-old message in
   * after this morning's, and appending put 14:05 below 13:28. A row with
   * no time goes last, like a message being sent right now. */
  var box=document.getElementById('msgs');
  var t=row.ts||0;
  d.setAttribute('data-ts',t||9e9);
  var at=null,kids=box.children;
  if(t)for(var j=kids.length-1;j>=0;j--){
    if(+kids[j].getAttribute('data-ts')<=t){at=kids[j].nextSibling;break;}
    at=kids[j];}
  var stick=box.scrollTop+box.clientHeight>=box.scrollHeight-40;
  box.insertBefore(d,at);
  daysSoon();
  if(stick||own)box.scrollTop=box.scrollHeight;
  return d;
}
// ---- days in a conversation, as WhatsApp and Telegram show them ----------
// A bubble says the time; a pill above the first message of each day says
// which day: Today, Yesterday, the weekday within the week, then the date.
function clockOf(ts){var d=new Date(ts*1000);return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();}
function dayStart(ts){var d=new Date(ts*1000);d.setHours(0,0,0,0);return d.getTime()/1000;}
function dayLabel(ts){
  var t0=dayStart(Date.now()/1000),d0=dayStart(ts),days=Math.round((t0-d0)/86400),d=new Date(ts*1000);
  if(days===0)return 'Today';
  if(days===1)return 'Yesterday';
  if(days>1&&days<7)return d.toLocaleDateString(undefined,{weekday:'long'});
  var o={day:'numeric',month:'long'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return d.toLocaleDateString(undefined,o);
}
var daysTimer=null;
function daysSoon(){if(!daysTimer)daysTimer=setTimeout(function(){daysTimer=null;drawDays();},0);}
/* Separators carry a data-ts just before their day's first second, so the
 * ordered insert of render() puts every message after its own day's pill. */
function drawDays(){
  var box=el('msgs');if(!box||/\balerts\b/.test(box.className))return;
  var old=box.querySelectorAll('.daysep'),i;for(i=0;i<old.length;i++)old[i].parentNode.removeChild(old[i]);
  var kids=[].slice.call(box.children),last=null;
  for(i=0;i<kids.length;i++){
    var t=+kids[i].getAttribute('data-ts');
    if(!t||t>=9e9||!/\bmsg\b/.test(kids[i].className))continue;
    var ds=dayStart(t);
    if(ds!==last){
      var p=document.createElement('div');p.className='daysep';p.setAttribute('data-ts',ds-0.5);
      p.innerHTML='<span>'+esc(dayLabel(t))+'</span>';box.insertBefore(p,kids[i]);last=ds;}
  }
}
function clearChat(){
  toggleMenu();
  clearedBefore=Math.floor(Date.now()/1000);
  stSet('xprs_cleared',''+clearedBefore);
  seen={};
  document.getElementById('msgs').innerHTML='';
  snack('Chat view cleared');
}
var chatLoaded=false;
/* Each room's archive, asked for by room (room=, spec/API-HTTP.md), once
 * per page. The newest 200 of everything is one room on a busy station:
 * a bridged Meshtastic channel alone filled it, and Local and Global showed
 * nothing although the station held their conversations. One room at a
 * time, chained: the station has one HTTP worker. A station that does not
 * know room= answers its newest messages, which render() files as usual. */
var roomsBackfilled=false;
function backfillRooms(){
  if(roomsBackfilled)return;
  roomsBackfilled=true;
  var asks=[['local','message'],['regional','message'],['global','message'],
            ['social','status']];
  (function next(i){
    if(i>=asks.length)return;
    var a=asks[i];
    getJSON('/api/xprs/history?kind='+a[1]+'&room='+a[0]+'&limit=100'+
            (sess?'&session='+sess:''),function(d){
      if(d&&d.private){roomPrivate[a[0]]=true;if(curRoom===a[0])switchRoom(curRoom);}
      var rows=(d&&d.rows||[]).slice().reverse();
      for(var j=0;j<rows.length;j++)render(rows[j]);
      next(i+1);
    });
  })(0);
}
var loadBusy=false,chatDeep=false;
function load(){
  // Every three seconds, and never two at once: a station without PSRAM
  // serves 200 rows in five seconds, and a page that asked for them every
  // three seconds with a four-second timeout queued abandoned requests at
  // its single-threaded server until nothing was answered at all ("connecting"
  // forever on the T-Dongle). So: the newest 40 first, which every board
  // answers in under a second, then once the full 200 in the background
  // (render() files rows by time and skips ones it has), then 40 a tick.
  if(loadBusy)return;
  loadBusy=true;
  try{
    var x=new XMLHttpRequest();
    var deep=chatLoaded&&!chatDeep;
    x.open('GET','/api/xprs/history?kind=message,reaction,status&limit='+
           (deep?200:40)+(sess?'&session='+sess:''),true);
    x.timeout=deep?20000:8000;
    x.onloadend=function(){loadBusy=false;};
    x.onload=function(){
      try{
        var d=JSON.parse(x.responseText);
        if(deep)chatDeep=true;
        chatLoaded=true;
        if(d.moderation)applyModeration(d.moderation);
        var rows=(d.rows||[]).slice().reverse();
        setTimeout(backfillRooms,0);
        for(var i=0;i<rows.length;i++){
          var t=rows[i].type||'';
          if(t==='message'||t==='reaction'||t==='status')render(rows[i]);
        }
        document.getElementById('stat').textContent=
          (d.held!==undefined?d.held+' packets held':'ok');
      }catch(e){}
    };
    x.send();
  }catch(e){loadBusy=false;}
}

// ---- the other four tabs -------------------------------------------------
//
// Everything here is read-only and comes from the endpoints the station
// already answers, so the phone on the hotspot sees what the board's own
// screen shows: who is in reach (the Reachable panel), what went past
// (Traffic), the three series (Stats), and the device itself.
//
// Only the visible tab polls, and each at the rate its data actually
// changes. The station has one HTTP worker and one 2 KB buffer for every
// reply; four phones polling five endpoints each would be the whole budget
// spent on nobody looking.
var tab='chat', tabTimer=null;
var TAB_MS={chat:3000,traffic:5000,devices:5000,stats:60000,station:10000,settings:5000,admin:60000};

function el(id){return document.getElementById(id);}
function esc(t){return String(t==null?'':t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ago(sec){
  sec=Math.max(0,Math.round(sec));
  if(sec<60)return sec+'s';
  if(sec<3600)return Math.round(sec/60)+'m';
  if(sec<86400)return Math.round(sec/3600)+'h';
  return Math.round(sec/86400)+'d';
}
// Words, not a stopwatch: the two largest non-zero units. "168h" is not an
// uptime anybody reads, and this row has the width for "1 day, 3 hours".
function plur(n,w){return n+' '+w+(n==1?'':'s');}
function hms(sec){
  var d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),
      m=Math.floor(sec%3600/60),s=Math.floor(sec%60);
  if(d)return h?plur(d,'day')+', '+plur(h,'hour'):plur(d,'day');
  if(h)return m?plur(h,'hour')+', '+m+' min':plur(h,'hour');
  if(m)return m+' min, '+s+' s';
  return s+' s';
}
// The same shape for "how much battery is left", which is a duration too.
function left(sec){
  var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return h?h+'h '+(m<10?'0':'')+m+'m':m+'m';
}
function kb(n){
  if(n==null)return '-';
  return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
}
function getJSON(url,cb){
  try{
    var x=new XMLHttpRequest();
    x.open('GET',url,true);
    x.timeout=6000;
    x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){cb(null);}};
    x.onerror=x.ontimeout=function(){cb(null);};
    x.send();
  }catch(e){cb(null);}
}
function fail(id,what){
  el(id).innerHTML='<p class="dim">'+esc(what)+' unavailable on this station.</p>';
}

function showTab(t){
  if(tab==='admin'&&t!=='admin')adminDirty=false;
  tab=t;
  el('chatwrap').className=t==='chat'?'':'hide';
  var views=['traffic','devices','stats','station','settings','admin'];
  for(var j=0;j<views.length;j++)
    el('v-'+views[j]).className='view'+(views[j]===t?'':' hide');
  if(tabTimer)clearInterval(tabTimer);
  tick();
  tabTimer=setInterval(tick,TAB_MS[t]||10000);
}
function tick(){
  if(tab==='chat'){
    if(curRoom==='alerts')loadAlertsFeed();
    else if(curRoom==='blog')loadBlogFeed();
    else if(curRoom==='forum')loadForumIndex();
    else if(GAL_KINDS[curRoom])loadGallery();
    else if(curRoom.slice(0,2)==='f:')loadForum();
    else if(curRoom.slice(0,2)==='g:')loadHosted();
    else load();
  }
  else if(tab==='traffic')loadTraffic();
  else if(tab==='devices')loadDevices();
  else if(tab==='stats')loadStats();
  else if(tab==='station')loadStation();
  else if(tab==='settings')loadSettings();
  else if(tab==='admin')loadAdmin();
}
// Stats, Station and Settings live behind the menu, not in the tab row.
function openView(t){toggleMenu();showTab(t);}

// Traffic: every packet the station filed, not only the ones chat shows.
//
// One entry per packet. The archive files a copy for every bearer a packet
// left or arrived on, and a station on BLE, ESP-NOW, LoRa and the LAN showed
// the same message four to ten times with only the bearer changed. Copies
// are the same packet by the XPRS.md 5 identifier (wireId: via: and sig:
// left out), so they merge into one entry whose tags say where it went
// ("sent") and where it came from ("heard"), the loudest signal per bearer.
//
// Stacked rows rather than a table: six columns and a raw wire do not fit
// 390 px, and a page that scrolls sideways on a phone is the wrong answer.
function trafficGroups(rows){
  var order=[],by={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i],k=wireId(r.wire||'');
    var g=by[k];
    if(!g){g=by[k]={row:r,ts:r.ts||0,own:!!r.own,tags:{},tagOrder:[]};order.push(g);}
    if((r.ts||0)>g.ts)g.ts=r.ts;
    if(r.own)g.own=true;
    if(r.sig==='verified'||(r.sig==='unverified'&&g.row.sig==='none'))g.row=r;
    var t=(r.own?'sent':'heard')+'|'+(r.bearer||'?');
    var tg=g.tags[t];
    if(!tg){tg=g.tags[t]={dir:r.own?'sent':'heard',bearer:r.bearer||'?',
                          rssi:0,n:0};g.tagOrder.push(t);}
    tg.n++;
    if(r.rssi&&(!tg.rssi||r.rssi>tg.rssi))tg.rssi=r.rssi;
  }
  return order;
}
function loadTraffic(){
  getJSON('/api/xprs/history?limit=120',function(d){
    if(!d||!d.rows)return fail('v-traffic','History');
    var h='',now=Math.floor(Date.now()/1000);
    var gs=trafficGroups(d.rows);
    for(var i=0;i<gs.length&&i<60;i++){
      var g=gs[i],r=g.row,tags='';
      for(var j=0;j<g.tagOrder.length;j++){
        var tg=g.tags[g.tagOrder[j]];
        tags+='<span class="btag '+tg.dir+'" title="'+tg.dir+' on '+
              esc(tg.bearer)+(tg.n>1?', '+tg.n+' copies':'')+'">'+
              (tg.dir==='sent'?'&uarr;':'&darr;')+esc(tg.bearer)+
              (tg.rssi?' '+esc(tg.rssi):'')+'</span>';
      }
      h+='<div class="pkt"><div class="l1">'+
         '<b>'+esc(r.from||'?')+'</b>'+
         (g.own?' <span class="dim">(us)</span>':'')+
         ' <span class="dim">&rarr;</span> '+esc(r.to||'all')+
         '<span class="when">'+(g.ts?esc(ago(now-g.ts)):'-')+'</span></div>'+
         '<div class="l2">'+esc(r.type||'')+
         ' &middot; <span class="sig-'+esc(r.sig||'none')+'">'+
         esc(r.sig||'none')+'</span> '+tags+'</div>'+
         '<div class="wire">'+esc(r.wire||'')+'</div></div>';
    }
    el('v-traffic').innerHTML=(d.held!==undefined?
      '<p class="dim">'+d.held+' packets held on this station</p>':'')+h;
  });
}

// Devices: the Reachable panel, same list, same five-minute window.
function loadDevices(){
  getJSON('/api/xprs/devices',function(d){
    if(!d||!d.devices)return fail('v-devices','The heard-station list');
    if(!d.devices.length){
      el('v-devices').innerHTML='<p class="dim">Nobody in range. '+
        'Heard '+(d.heard||0)+' packets since boot.</p>';
      return;
    }
    var h='<table class="tbl"><tr><th>Call</th><th>Link</th><th>Signal</th>'+
          '<th>Distance</th><th>Heard</th></tr>';
    for(var i=0;i<d.devices.length;i++){
      var v=d.devices[i];
      h+='<tr><td>'+esc(v.call)+(v.hops?' <span class="dim">+'+v.hops+
         ' hop'+(v.hops>1?'s':'')+'</span>':'')+'</td>'+
         '<td class="n">'+esc(v.bearer)+'</td>'+
         '<td class="n">'+(v.rssi?esc(v.rssi)+' dBm':'-')+'</td>'+
         '<td class="n">'+distCell(v)+'</td>'+
         '<td class="n">'+esc(ago(v.age_s))+' ago</td></tr>';
    }
    h+='</table><p class="dim">Distance is estimated from signal strength '+
       'and is only as good as the room. A station reached through another '+
       'is as far as that relay plus the relay\'s own reading of it; '+
       '&gt; is what was measured so far, the distance to the repeater it '+
       'was heard from. '+(d.heard||0)+' packets heard since boot.</p>';
    el('v-devices').innerHTML=h;
  });
}
// The Distance cell. A relayed row's signal is the relay's, so the station
// adds the relay's own reading of the far station (dist_m is the sum, with
// near_m to the relay and far_m beyond it). When a leg has not been said,
// what WAS measured is shown as a floor (floor_m): for a Meshtastic node
// behind a repeater that is the radio's own reading of the repeater, which
// is exactly what somebody standing next to the station wants. A neighbour
// is just dist_m.
function distCell(v){
  var via=v.via?' <span class="dim">via '+esc(v.via)+'</span>':'';
  if(v.dist_m>=0){
    var t=v.via&&v.near_m>=0?' title="~'+esc(v.near_m)+' m to '+esc(v.via)+
          ', ~'+esc(v.far_m)+' m from there"':'';
    return '<span'+t+'>~'+esc(v.dist_m)+' m</span>'+via;
  }
  if(v.floor_m>=0){
    var who=v.via?esc(v.via):'a repeater';
    return '<span title="'+esc(v.call)+' was heard through '+who+' about '+
           esc(v.floor_m)+' m away; how far it is beyond that '+
           (v.via?who+' has':'nobody has')+' said">&gt;~'+
           esc(v.floor_m)+' m</span>'+via;
  }
  return '-'+via;
}

// Stats: the same three series the Stats panel charts.
var statsView=0;
function setStatsView(v){statsView=v;loadStats();}
function bars(vals){
  var max=1;
  for(var i=0;i<vals.length;i++)if(vals[i]>max)max=vals[i];
  var h='<div class="bars">';
  for(var j=0;j<vals.length;j++)
    h+='<div style="height:'+Math.max(1,Math.round(vals[j]/max*100))+'%" '+
       'title="'+vals[j]+'"></div>';
  return h+'</div><p class="dim">peak '+max+'</p>';
}
function loadStats(){
  getJSON('/api/stats?view='+statsView,function(d){
    if(!d||!d.devices)return fail('v-stats','Statistics');
    var names=['10 minutes','hour','day'];
    var h='<div class="viewbtns">';
    for(var i=0;i<3;i++)
      h+='<button class="'+(i===statsView?'on':'')+'" '+
         'onclick="setStatsView('+i+')">per '+names[i]+'</button>';
    h+='</div>';
    if(!d.points){
      h+='<p class="dim">Nothing banked yet &mdash; the station buckets by '+
         'wall clock and has no time yet.</p>';
    }else{
      h+='<h3>Devices heard</h3>'+bars(d.devices)+
         '<h3>Packets received</h3>'+bars(d.rx)+
         '<h3>Packets sent</h3>'+bars(d.tx)+
         '<p class="dim">'+d.points+' buckets of '+
         (d.bucket_s>=86400?'a day':d.bucket_s>=3600?'an hour':'ten minutes')+
         ', oldest first.</p>';
    }
    el('v-stats').innerHTML=h;
  });
}

// Station: what the This-device and Settings panels say, plus the screen.
function row(k,v){return '<tr><td>'+esc(k)+'</td><td>'+v+'</td></tr>';}
/* A station without /api/status (the server edition) still has a Station
 * view: its callsign and, from /api/services, where the internet reaches it. */
function loadStation(){
  getJSON('/api/status',function(d){
    if(!d||d.ok===false)d={};
    if(!d.callsign&&!stationCall)return fail('v-station','Station status');
    var h='<h3>Station</h3><table class="kv">'+
      row('Callsign',esc(d.callsign||stationCall||''))+
      (stationPos?row('Location','<a href="'+esc(posLink(stationPos))+'" target="_blank" rel="noopener">'+esc(posText(stationPos))+'</a>'):'')+
      (d.board!==undefined?row('Board',esc(d.board||'')):'')+
      (d.uptime_s!==undefined?row('Uptime',esc(hms(d.uptime_s||0))):'')+
      (d.heap_free!==undefined?row('Free memory',esc(kb(d.heap_free))):'')+
      (d.time?row('Clock',d.time.synced?
          esc(new Date(d.time.epoch*1000).toISOString().slice(0,19)
              .replace('T',' '))+' UTC':'<span class="dim">not synced</span>'):'');
    if(d.battery&&d.battery.mv>0){
      // esc() on everything from the wire, exactly as this row did before
      // it grew fields: the surrounding string is raw HTML by design (see
      // the 'Address' row) and that only stays safe while the values are
      // escaped.
      var b=d.battery,t=(b.pct>=0?esc(b.pct)+'%':'')+
            (b.secs_left>0?' \u00b7 about '+esc(left(b.secs_left))+' left':'')+
            ' \u00b7 '+esc(b.mv)+' mV \u00b7 '+esc(b.state);
      // What the gauge has NOT learned is worth a line: a percentage with no
      // discharge behind it is a curve's opinion, and saying so is the
      // difference between a gauge and a decoration.
      if(!b.cycles) t+=' <span class="dim">(voltage only)</span>';
      else if(b.confidence<100)
        t+=' <span class="dim">('+esc(b.cycles)+' cycle'+(b.cycles==1?'':'s')+
           ' learned)</span>';
      if(b.saving) t+=' <span class="dim">\u00b7 saving power</span>';
      h+=row('Battery',t);
    }
    if(d.net)
      h+=row('Address',d.net.ip?esc(d.net.ip):'<span class="dim">hotspot only</span>')+
         row('Internet',d.net.internet==null?'<span class="dim">unknown</span>':
             (d.net.internet?'reachable':'no'));
    if(d.heard!==undefined)
      h+=row('Heard',esc(d.heard)+' packets, '+esc(d.in_reach||0)+' in reach now');
    var ar=d.archiver||d.indexer; // "indexer" until 2026-11-06, older builds
    if(ar)
      h+=row('Archive',esc(ar.count)+' packets held');
    if(sessHolders)
      h+=row('My mailbox',sessHolders.length?esc(sessHolders.join(', ')):
             '<span class="dim">none yet</span>');
    h+='</table>';
    if(d.lora){
      h+='<h3>LoRa</h3><table class="kv">'+
        row('Region',esc(d.lora.region||''))+
        row('Frequency',(d.lora.freq_hz/1e6).toFixed(3)+' MHz')+
        row('Airtime left',Math.round(d.lora.free_ms/1000)+' s of '+
            Math.round(d.lora.duty_ms/1000)+' s this hour')+
        row('Waiting',esc(d.lora.held)+' packets')+'</table>';
    }
    el('v-station').innerHTML=h+'<div id="st-more"></div>';
    getJSON('/api/services',function(sv){
      if(!sv||!sv.features)return;
      var f=sv.features,k,h2='',i2;
      /* Where the internet reaches this station (API-HTTP.md urls,
       * urls_pending): the links to hand out, and the names still waiting
       * for the router to let their ports in. */
      if(sv.urls||sv.urls_pending){
        var us=sv.urls||[],ps=sv.urls_pending||[];
        h2+='<h3>Web address</h3><table class="kv">';
        for(i2=0;i2<us.length;i2++)
          h2+=row(i2?'':'Reachable at','<a href="'+esc(us[i2])+'">'+esc(us[i2])+'</a>');
        if(!us.length)h2+=row('Reachable at','<span class="dim">not from the internet yet</span>');
        for(i2=0;i2<ps.length;i2++)
          h2+=row(i2?'':'Not reachable yet','<span class="dim">'+esc(ps[i2])+'</span>');
        h2+='</table>';
        if(ps.length)h2+='<p class="dim">A name works once the router lets TCP ports 80 and 443 in to this machine '+
          'for that address; the station tests it again by itself.</p>';
      }
      /* The Reticulum node on the station's TCP port (XPRS.md 13.4): whether
       * the internet reaches it, and what a Reticulum client points at. */
      if(sv.rns&&sv.rns.port){
        var rn=sv.rns,dl=rn.dial?String(rn.dial):'',hp=dl.split(':'),host=hp[0],
            prt=hp.length>1?hp[1]:String(rn.port);
        h2+='<h3>Reticulum node</h3><table class="kv">'+
          row('Port','TCP '+esc(rn.port))+
          row('From the internet',rn.reachable===true?'reachable':
              rn.reachable===false?'<span class="dim">not reachable</span>':
              '<span class="dim">not tested yet</span>')+
          (dl?row('Connect to',esc(host)+' port '+esc(prt)):'')+'</table>';
        if(dl)h2+='<p class="dim">In a Reticulum configuration: a TCPClientInterface with target_host = '+
          esc(host)+' and target_port = '+esc(prt)+'.</p>';
        else if(rn.reachable===false)h2+='<p class="dim">Forward TCP port '+esc(rn.port)+
          ' on the router to this machine, as for ports 80 and 443; the station tests it again within half an hour.</p>';
      }
      var hasF=false;for(k in f){hasF=true;break;}
      if(hasF){
        h2+='<h3>Roles</h3><table class="kv">';
        for(k in f)h2+=row(k,f[k]?'on':'<span class="dim">off</span>');
        h2+='</table>';
      }
      if(sv.serve&&sv.serve.length)
        h2+='<p class="dim">Announced to others: '+esc(sv.serve.join(', '))+'</p>';
      /* The screen, heading and all, only on a station that has one. */
      h2+='<div id="st-screen"><h3>Screen</h3><img class="shot" alt="the station screen" '+
          'src="/api/screen?t='+Date.now()+'" '+
          'onerror="var d=el(\'st-screen\');if(d)d.parentNode.removeChild(d)"></div>';
      var m=el('st-more'); if(m)m.innerHTML=h2;
    });
  });
}

// ---- settings: the internet WiFi. Any visitor may add a network; none can
// be removed (docs/esp32.md). Built once and only updated after, so a
// refresh never closes a phone's keyboard or moves a field being typed in.
/* The WiFi controls are one node, made once and moved between Settings and
 * Administration, so a redraw of either never loses what is being typed. */
var wifiNode=null,canWifi=false,amAdmin=false;
function wifiBox(){
  if(!wifiNode){
    wifiNode=document.createElement('div');
    wifiNode.innerHTML='<table class="kv" id="wf-st"></table>'+
      '<p class="dim" id="wf-lock" style="display:none">The station is online. Only its '+
      'administrator changes its network; anyone may add one while it is offline.</p>'+
      '<div id="wf-join"><h3>Join a network</h3><div class="wform">'+
      '<button onclick="wifiScan()" id="wf-scan">Search</button></div>'+
      '<table class="kv" id="wf-nets"></table>'+
      '<div class="wform"><input id="wf-ssid" maxlength="32" placeholder="Network name"'+
      ' autocomplete="off" autocapitalize="off"><input id="wf-pass" type="password"'+
      ' maxlength="63" placeholder="Password" autocomplete="off">'+
      '<button onclick="wifiJoin()">Join</button></div></div><p class="dim" id="wf-msg"></p>';
  }
  return wifiNode;
}
function loadSettings(){
  var v=el('v-settings');
  if(!el('set-wifi')){
    v.innerHTML='<h3>Internet WiFi</h3><div id="set-wifi"></div>';
  }
  el('set-wifi').appendChild(wifiBox());
  wifiShow();
}
function wifiShow(){
  getJSON('/api/wifi',function(w){
    var t=el('wf-st');
    if(!w||!t)return;
    var k=w.known||[],names=[];
    for(var i=0;i<k.length;i++)
      names.push(esc(k[i].ssid)+(k[i].internet?'':' <span class="dim">(no internet)</span>'));
    t.innerHTML=row('Network',w.ssid?esc(w.ssid):'<span class="dim">none</span>')+
      row('Connected',w.up?(w.internet?'yes, with internet':w.internet===false?
          'yes, no internet':'yes'):'no')+
      row('Remembered',names.length?names.join(', '):'<span class="dim">none yet</span>');
    /* A visitor keeps a station online; it does not move a working one. */
    var locked=w.up&&w.internet!==false&&!amAdmin;
    el('wf-join').style.display=locked?'none':'';
    el('wf-lock').style.display=locked?'':'none';
    var m=el('wf-msg');
    if(w.join==='joining')m.textContent='Joining…';
    else if(w.join==='failed')m.textContent='Could not join'+(w.why?': '+w.why:'')+'.';
    else if(w.join==='joined')m.textContent='Joined.';
  });
}
var scanTries=0;
function wifiScan(){
  el('wf-scan').disabled=true;
  el('wf-nets').innerHTML=row('','Searching…');
  var x=new XMLHttpRequest();
  x.open('POST','/api/wifi/scan');
  x.onload=function(){scanTries=0;setTimeout(scanPoll,2500);};
  x.onerror=function(){el('wf-scan').disabled=false;
    el('wf-nets').innerHTML=row('','No answer. Try again.');};
  x.send('');
}
function scanPoll(){
  getJSON('/api/wifi/scan',function(r){
    if(r&&r.state==='scanning'&&++scanTries<10){setTimeout(scanPoll,1000);return;}
    el('wf-scan').disabled=false;
    var t=el('wf-nets');
    if(!r||r.state!=='done'){
      t.innerHTML=row('','The search did not finish'+(r&&r.why?': '+esc(r.why):'')+'.');
      return;
    }
    var n=r.nets||[],h='';
    if(!n.length)h=row('','No networks in range.');
    for(var i=0;i<n.length;i++){
      var bars=n[i].rssi>-60?'strong':n[i].rssi>-75?'good':'weak';
      h+='<tr class="net" data-i="'+i+'"><td>'+esc(n[i].ssid)+'</td><td>'+bars+
         (n[i].open?', open':'')+(n[i].known?', remembered':'')+'</td></tr>';
    }
    t.innerHTML=h;
    var rows=t.getElementsByTagName('tr');
    for(var j=0;j<rows.length;j++)rows[j].onclick=(function(net){return function(){
      el('wf-ssid').value=net.ssid;
      el('wf-pass').value='';
      if(net.open)el('wf-msg').textContent='Open network: press Join.';
      else el('wf-pass').focus();
    };})(n[+rows[j].getAttribute('data-i')]);
  });
}
function wifiJoin(){
  var s=el('wf-ssid').value,p=el('wf-pass').value,m=el('wf-msg');
  if(!s)return;
  m.textContent='Sending…';
  var x=new XMLHttpRequest();
  x.open('POST','/api/wifi');
  x.setRequestHeader('Content-Type','application/x-www-form-urlencoded');
  x.onload=function(){
    var j=null;
    try{j=JSON.parse(x.responseText);}catch(e){}
    if(j&&j.ok){el('wf-pass').value='';m.textContent='Joining…';}
    else m.textContent='Not taken'+(j&&j.error?': '+j.error:'')+'.';
  };
  // A join can take the hotspot off its channel for a moment.
  x.onerror=function(){m.textContent='No answer. Reload in a minute.';};
  x.send('ssid='+encodeURIComponent(s)+'&pass='+encodeURIComponent(p)+
    (sess?'&session='+encodeURIComponent(sess):''));
}

// ---- collections: Gallery, Music, Library (API-HTTP.md) -----------------
//
// One module for the three. A collection's categories are the station's
// rooms of that kind (the administrator makes them); a folder (an event, an
// album, a shelf) is a titled t:blog in one (its moderators make them); an
// item is a t:message r:<folder>, carrying a preview in file: when it has
// one (a photo, a film), with a t:file r:<item> naming the file itself
// (XPRS.md 7.7.7); a like is t:reaction add:like. Everything is read from
// the room's history and put together here. What differs between the three
// is only GAL_KINDS below: names, what files they take, and how they look.
var GAL_KINDS={
  gallery:{name:'Gallery',folder:'event',Folder:'Event',folders:'events',item:'photo',items:'photos',
    add:'Add photos and films',accept:'image/*,video/*',grid:true,preview:true,
    hint:'Name (field day 2026)',about:'What it was (optional)'},
  music:{name:'Music',folder:'album',Folder:'Album',folders:'albums',item:'track',items:'tracks',
    add:'Add tracks',accept:'audio/*,.mp3,.flac,.ogg,.opus,.m4a,.wav,.aac',grid:false,preview:false,
    hint:'Album (live at the hall)',about:'Artist, year (optional)'},
  library:{name:'Library',folder:'shelf',Folder:'Shelf',folders:'shelves',item:'file',items:'files',
    add:'Add files',accept:'',grid:false,preview:false,
    hint:'Shelf (manuals)',about:'What it holds (optional)'}
};
var canGallery=false,galKind='gallery',galCat=null,galEvent=null,galRows=null,galAt=0;
function galK(){return GAL_KINDS[galKind];}
function wf(w,k){
  var m=(' '+w).match(new RegExp(' '+k+':(\\S*)'));
  if(!m)return '';
  if(k==='m'){var i=(' '+w).indexOf(' m:');return (' '+w).slice(i+3);}
  return m[1];
}
function galStaff(hr){return !!hr&&(hr.role==='mod'||hr.role==='admin'||isStationAdmin);}
function galRooms(){return hostedRooms.filter(function(hr){return hr.kind===galKind;});}
function galOpen(call){galCat=call;galEvent=null;galRows=null;loadGallery(true);}
function galOpenEvent(id,title){galEvent={id:id,title:title};loadGallery(true);}
function galBack(){if(galEvent)galEvent=null;else galCat=null;galRows=null;loadGallery(true);}
function galRoom(){return galCat?hostedByCall[galCat]:null;}
function galTitle(t){return String(t||'').replace(/-/g,' ');}
/* The room's items, their files and the likes, newest 500, as a tree. */
function galTree(rows){
  var t={pics:{},byEvent:{},orig:{},likes:{},mine:{}};
  for(var i=rows.length-1;i>=0;i--){var r=rows[i],w=r.wire||'',id=r.id||wireId(w);
    if(r.type==='message'&&wf(w,'r')){
      var ev=wf(w,'r');
      t.pics[id]={id:id,ev:ev,prev:wf(w,'file'),from:r.from,ts:r.ts,cap:wf(w,'m')};
      (t.byEvent[ev]=t.byEvent[ev]||[]).push(id);

  var K=GAL_KINDS[hr.kind]||galK(),ext=mdExtOf(f.name,f.type);

    galRefOf(f,ext,function(p){say('reading '+Math.round(p*100)+'%');},function(oref){
      if(!oref){snack('Could not read '+f.name);return cb();}
      galPut(oref,f,false,function(p){say('sending '+Math.round(p*100)+'%');},function(ok,why){
        if(!ok){snack('The station did not keep '+f.name+': '+why);return cb();}

              galPost(w2,function(){cb();});

    if(!tb){snack('Neither a picture nor a film this browser can read: '+f.name);return cb();}

/* Moderators, invitations and people sent away (XPRS.md 10.10). The
   administrator appoints, dismisses and lifts; a moderator sees the lists. */
function drawModeration(d,isAdmin){
  if(d.role===undefined)return '';
  stationCall=d.station||stationCall;
  myStationRole=d.role;myOffer=d.offer||'';
  var h='';
  if(d.role==='invited'&&d.offer)
    h+='<h3>Moderation</h3><div class="card"><p class="lead">You were asked to moderate this '+
      'station&rsquo;s rooms: delete messages and send people away.</p>'+
      '<div class="frow"><button class="act primary" id="ad-accept" onclick="acceptModerator()">Accept</button></div></div>';
  /* An administrator who does not moderate (claimed before moderation, or
     declined it): the station appoints them, and the page accepts. */
  if(isAdmin&&d.role==='none')
    h+='<h3>Moderation</h3><div class="card"><p class="lead">You administer this station but do not '+
      'moderate its rooms.</p><div class="frow"><button class="act" id="ad-selfmod" '+
      'onclick="adminDo(\'appoint\',{call:baseCall(mycall)})">Moderate as well</button></div></div>';
  if(!d.moderators)return h;
  var i,rows=function(a,btn){
    if(!a.length)return '<div class="empty">none</div>';
    var t='<div class="roster">';
    for(i=0;i<a.length;i++){
      var c=typeof a[i]==='string'?a[i]:a[i].call;
      var note=a[i].until?'until '+esc(a[i].until.slice(0,16).replace('T',' '))+' UTC':
               (typeof a[i]==='string'?'':'until lifted');
      t+='<div class="row">'+callLink(c)+
        (note?'<span class="pill">'+note+'</span>':'')+'<span class="sp"></span>'+
        (isAdmin&&btn?'<button class="act quiet" onclick="adminDo(\''+btn[0]+'\',{call:\''+esc(c)+'\'})">'+btn[1]+'</button>':'')+
        '</div>';
    }
    return t+'</div>';
  };
  h+='<h3>Moderators</h3><div class="card">'+rows(d.moderators,['dismiss','Dismiss']);
  if(d.invited&&d.invited.length)
    h+='<div class="lead" style="margin-top:8px">Asked, not yet accepted: '+d.invited.map(callLink).join(', ')+'</div>';
  if(isAdmin)h+='<div class="frow"><input id="ad-newmod" class="grow" placeholder="Callsign" '+
    'style="text-transform:uppercase"><button class="act" onclick="adminAppoint()">Appoint a moderator</button></div>';
  h+='</div><h3>Sent away</h3><div class="card">'+rows(d.away||[],['lift','Lift'])+'</div>';
  return h;
}
// ---- rooms this station hosts (XPRS.md 10.10.1) ---------------------------
//
// Closed groups whose key the station holds: the administrator creates them
// (public or private, anyone or members posting), adds members and appoints
// moderators; the station signs those acts as the room. Members accept with
// their own signature (10.3.1). Traffic stays on the station.
var canRooms=false,hostedRooms=[],hostedByCall={},roomAccepting={};
function loadRooms(cb){
  if(!canRooms)return;
  getJSON('/api/rooms'+(sess?'?session='+encodeURIComponent(sess):''),function(d){
    if(!d||!d.rooms)return;
    hostedRooms=d.rooms;hostedByCall={};
    for(var i=0;i<d.rooms.length;i++){var hr=d.rooms[i];hostedByCall[hr.call]=hr;
      /* The administrator moderates every room: the role the station offers
       * on each is accepted as it comes, once. */
      if(isStationAdmin&&hr.role==='invited'&&hr.offer&&!roomAccepting[hr.call]){
        roomAccepting[hr.call]=1;acceptRoom(hr.call,hr.offer,hr.offer_role||'mod');}
    }
    renderSide();
    if(curRoom.slice(0,2)==='g:')switchRoom(curRoom);
    if(curRoom.slice(0,2)==='f:')forumComposer();
    if(cb)cb(d.rooms);
  });
}
function loadHosted(){
  if(curRoom.slice(0,2)!=='g:')return;
  var call=curRoom.slice(2);
  getJSON('/api/xprs/history?kind=message,reaction&room='+encodeURIComponent(call)+
          '&limit=100'+(sess?'&session='+encodeURIComponent(sess):''),function(d){
    if(!d||!d.rows)return;
    /* Removals are by packet id; who a ROOM sent away is the room's own. */
    if(d.moderation)applyModeration({removed:d.moderation.removed||[],away:Object.keys(modAway)});
    var rows=d.rows.slice().reverse();
    for(var i=0;i<rows.length;i++)render(rows[i]);
  });
}
function acceptRoom(call,offer,role){
  sendIdentity();
  signAny('t:moderate f:'+mycall+' d:'+call+' ts:'+tsNow()+' r:'+offer+
          ' accept:'+(role==='mod'?'mod':'member'),function(w){
    if(!w)return snack('Not signed');
    postWire(w,function(ok,why){
      if(!ok)return snack(why||'The station refused it');
      if(!isStationAdmin)snack('Joined '+roomLabel('g:'+call));
      loadRooms(function(){if(tab==='admin')loadAdmin();});
    });
  });
}
function roomPost(b,done){
  b.session=sess;
  var x=new XMLHttpRequest();
  x.open('POST','/api/rooms',true);x.timeout=6000;
  x.onload=function(){
    var j=null;try{j=JSON.parse(x.responseText);}catch(e){}
    if(x.status===200&&j&&j.ok)loadRooms(function(){if(tab==='admin')loadAdmin();if(done)done(j);});
    else snack(j&&j.error||('HTTP '+x.status));
  };
  x.onerror=x.ontimeout=function(){snack('The station did not answer');};
  x.send(JSON.stringify(b));
}
function roomCreate(){

/* Create a room from the fields prefix+name/about/vis/post: the admin's New
 * room form, or the Forum's own category panel. done(room json) on success. */
function roomCreateFrom(prefix,kind,done){
  var name=(el(prefix+'name').value||'').trim();
  if(!name)return snack(kind==='forum'?'A category needs a name':'A room needs a name');
  roomPost({action:'create',name:name,about:(el(prefix+'about').value||'').trim(),
            visibility:el(prefix+'vis').value,posting:el(prefix+'post').value,kind:kind},function(j){
    /* The station offered us its moderator role: accept it now. */
    var hr=hostedByCall[j.room];
    if(hr&&hr.role==='invited'&&hr.offer)acceptRoom(hr.call,hr.offer,hr.offer_role||'mod');
    if(done)done(j);
  });
}
function roomDo(action,call){
  var m=(el('rm-'+call).value||'').trim().toUpperCase();
  if(!m)return snack('A callsign, please');

    snack(action==='add'?'Asked '+m+' to join':action==='appoint'?'Asked '+m+' to moderate':m+' removed');});
}
function roomSet(call){

function roomRename(call){

function roomClose(call){

function roomShare(call){
  var peers=(el('rsp-'+call).value||'').toUpperCase().split(/[\s,]+/).filter(function(x){return x;});

   * the other stations' operators can read it too. Said before it is done. */

    if(!peers.length)return snack('A private room is shared with named stations');
    if(!confirm('This room is private: its members read it, and so can you. Shared with '+peers.join(', ')+
                ', the operators of those stations can read it as well. Share it?'))return;
  }
  roomPost({action:'share',call:call,shared:shared,mesh:mesh,peers:peers},function(){snack('Sharing saved');});
}

function slugOf(t){return (t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40).replace(/-+$/,'');}
/* Up to nine parts of at most 250 bytes, split at spaces (7.6), signed once
 * over the whole and carried on the last part (9.1.1). cb(wires) or
 * cb(null, why). A post that fits one packet is signed as one. */
function splitSigned(head,text,cb){
  var sp=splitParts(head,text);
  if(sp.why)return cb(null,sp.why);
  var canonical=head+' m:'+text;
  if(!sp.parts){signAny(canonical,function(w,why){cb(w?[w]:null,why);});return;}
  signAny(canonical,function(signed,why){
    if(!signed)return cb(null,why);
    var m=signed.match(/ sig:([!-~]{60})/);
    if(!m)return cb(null,'Not signed');
    var k=sp.parts.length,out=[],j;
    for(j=0;j<k;j++)out.push(head+' n:'+(j+1)+'/'+k+(j===k-1?' sig:'+m[1]:'')+' m:'+sp.parts[j]);
    cb(out);
  });
}
/* The arithmetic of splitSigned on its own: {parts:null} when one signed
 * packet holds it, {parts:[...]} for a split, {why} when it cannot go, and
 * {count, per} either way for the composer's counter. */
function splitParts(head,text){
  if(u8(head+' m:'+text).length+65<=250)return {parts:null,count:1,per:0};
  var per=250-u8(head).length-6-65-3;        /* n:i/k, sig:, m: */
  if(per<24)return {why:'Too long a head for a split post',count:0,per:per};
  var words=text.split(' '),parts=[],cur='',i;
  for(i=0;i<words.length;i++){
    if(u8(words[i]).length>per)return {why:'A word too long for one packet',count:0,per:per};
    var next=cur?cur+' '+words[i]:words[i];
    if(u8(next).length>per){parts.push(cur);cur=words[i];}else cur=next;
  }
  if(cur)parts.push(cur);
  if(parts.length>9)return {why:'Too long: a post is at most nine packets, about '+(9*per)+' characters here',count:parts.length,per:per};
  return {parts:parts,count:parts.length,per:per};
}
/* One after another: the station holds the parts until the last arrives. */
function postWires(wires,i,cb){
  if(i>=wires.length)return cb(true);
  postWire(wires[i],function(ok,why){if(!ok)return cb(false,why);postWires(wires,i+1,cb);});
}

/* The author withdraws a post (7.8.2); a room moderator takes one down (10.10). */
function forumWithdraw(id){

function openTopic(id,title){forumTopic={id:id,title:title};forumComposer();el('msgs').innerHTML='';loadForum(true);}

/* A post as a card: the opening post with its title, or a comment. */
function postCard(p,op){

function loadForum(force){
  var hr=forumRoom();if(!hr)return;
  var t=Date.now();
  if(!force&&t-forumAt<15000)return;
  forumAt=t;
  var q=sess?'&session='+encodeURIComponent(sess):'';
  var here='f:'+hr.call;
  if(!forumTopic){
    if(force!==true&&mdBusy('ft'))return;
    getJSON('/api/rooms?topics='+encodeURIComponent(hr.call)+q,function(d){
      if(!d||!d.ok||curRoom!==here||forumTopic)return;
      var note=hr.mirrored?'<div class="roomnote">A copy of a room '+esc(hr.owner||'')+' holds, kept in step with it.</div>':
               hr.shared?'<div class="roomnote">Shared with other stations'+(hr.peers&&hr.peers.length?': '+esc(hr.peers.join(', ')):'')+'.</div>':'';
      el('msgs').innerHTML='<div class="roomnote"><button class="act quiet" onclick="switchRoom(\'forum\')">&#8592; Forum</button> '+esc(hr.name)+
        (hr.about?' <span class="dim">'+esc(hr.about)+'</span>':'')+'</div>'+note+topicForm(hr)+
        pendCards(pendFor(hr.call,'',d.topics||[]))+topicCards(d.topics||[]);
    });
    return;
  }

  getJSON('/api/xprs/history?room='+encodeURIComponent(hr.call)+'&kind=blog&root='+encodeURIComponent(want)+'&limit=200'+q,function(d){
    if(!d||!d.rows||curRoom!==here||!forumTopic||forumTopic.id!==want)return;
    if(d.moderation)applyModeration({removed:d.moderation.removed||[],away:Object.keys(modAway)});
    var posts=blogPosts(d.rows),i,top=null,comments=[];
    pendPrune(posts);
    for(i=0;i<posts.length;i++){
      if(modRemoved[posts[i].id])continue;
      if(posts[i].title){if(!top)top=posts[i];}
      else comments.push(posts[i]);
    }
    comments.sort(function(a,b){return a.ts-b.ts;});
    comments=comments.concat(pendFor(hr.call,want,posts));
    el('msgs').innerHTML='<div class="roomnote"><button class="act quiet" onclick="closeTopic()">&#8592; Topics</button> '+esc(hr.name)+'</div>'+
      (top?postCard(top,true):'<div class="card"><div class="empty">This topic is gone.</div></div>')+
      comments.map(function(c){return postCard(c,false);}).join('');
    var box=el('msgs');box.scrollTop=box.scrollHeight;
  });

// ---- posts on their way (XPRS.md 18, 7.6) ---------------------------------
// The station answers a send at once but files it in its archive on its own
// clock (a station batches its writes), and history reads only the archive.
// So the visitor's own post is drawn the moment it is signed, marked sending,
// then published, and stays until history returns the same packet (the same
// section 5 identifier). A refused one keeps its wires to try again. Kept in
// this browser's storage, so a reload in between does not lose it.
var PEND_KEY='xprs_pending_posts',pendingPosts=[],pendTimer=null,pendStep=0;
try{pendingPosts=JSON.parse(localStorage.getItem(PEND_KEY)||'[]')||[];}catch(e){pendingPosts=[];}
function pendSave(){try{localStorage.setItem(PEND_KEY,JSON.stringify(pendingPosts));}catch(e){}}
/* post: {room, r, title, text}; head the wire's head without n:/sig:/m:. */
function pendingPost(post,head,wires){
  var p={pend:1,id:wireId(wires.length===1?wires[0]:head+' m:'+post.text),
    room:post.room||'',r:post.r||'',from:mycall,ts:Math.floor(Date.now()/1000),
    title:post.title||'',tags:'',file:'',text:post.text,sig:'verified',
    state:'sending',why:'',at:Date.now(),wires:wires};
  pendingPosts=pendingPosts.filter(function(q){return q.id!==p.id;});
  pendingPosts.unshift(p);pendSave();pendDraw();pendSend(p);
}
function pendSend(p){
  p.state='sending';p.why='';pendSave();
  postWires(p.wires,0,function(ok,why){
    p.state=ok?'sent':'failed';p.why=ok?'':(why||'The station refused it');p.at=Date.now();
    pendSave();pendDraw();
    if(ok){snack('Published');pendPoll(true);}else snack(p.why);
  });
}
function pendById(id){for(var i=0;i<pendingPosts.length;i++)if(pendingPosts[i].id===id)return pendingPosts[i];return null;}
function pendRetry(id){var p=pendById(id);if(p){pendSend(p);pendDraw();}}
function pendDrop(id){pendingPosts=pendingPosts.filter(function(q){return q.id!==id;});pendSave();pendDraw();}
/* Forget what the station now files (list: posts or topics with .id), what
 * was published ten minutes ago and never came back, and a refusal a day old. */
function pendPrune(list){
  var have={},i,n=pendingPosts.length,now=Date.now();
  for(i=0;i<(list||[]).length;i++)have[list[i].id]=1;
  pendingPosts=pendingPosts.filter(function(p){
    if(have[p.id])return false;
    if(p.state==='sent'&&now-p.at>600000)return false;
    if(p.state!=='sent'&&now-p.at>86400000)return false;
    return true;});
  if(pendingPosts.length!==n)pendSave();
}
/* The pending posts of one place: the Blog ('' ''), a forum room's topics
 * (room, ''), or the comments of one topic (room, topic id). */
function pendFor(room,r,list){
  pendPrune(list);
  return pendingPosts.filter(function(p){return p.room===room&&p.r===r&&(r||p.title);});
}
function pendDraw(){
  if(curRoom==='blog'){if(!el('composer'))el('msgs').innerHTML=blogCards();}
  else if(forumRoom())loadForum(true);
}
/* Ask again soon while a post is published and not filed: 2, 4, 8, 16, then
 * every 30 seconds, for ten minutes at most. */
function pendPoll(reset){
  if(reset)pendStep=0;
  if(pendTimer){clearTimeout(pendTimer);pendTimer=null;}
  var waiting=pendingPosts.some(function(p){return p.state==='sent';});
  if(!waiting||pendStep>24)return;
  pendTimer=setTimeout(function(){
    pendTimer=null;pendStep++;
    if(curRoom==='blog')loadBlogFeed(true);
    else if(forumRoom())loadForum('poll');
    pendPoll(false);
  },[2000,4000,8000,16000,30000][Math.min(pendStep,4)]);
}
function pendPills(p){
  if(!p.pend)return '';
  if(p.state==='sending')return '<span class="pill">sending&hellip;</span>';
  if(p.state==='sent')return '<span class="pill on" title="The station took it and files it in its archive shortly">published</span>';
  return '<span class="pill bad" title="'+esc(p.why)+'">not sent</span>'+
    '<button class="act quiet" onclick="pendRetry(\''+esc(p.id)+'\')">Retry</button>'+
    '<button class="act quiet" onclick="pendDrop(\''+esc(p.id)+'\')">Discard</button>';
}
// ---- the post editor: raw text beside its preview (XPRS.md 4.11) -----------

    b('&rdquo;','Quote','&gt; ','')+b('&#128279;','Link','[','](https://)')+
    (fileCaps.put?'<button type="button" class="mdb" title="Image" onclick="el(\''+p+'-file\').click()">&#128247;</button>'+
      '<input type="file" id="'+p+'-file" accept="image/*" style="display:none" onchange="mdAttach(\''+p+'\',this)">':'')+
    '<span class="sp"></span><span class="mdtabs"><button type="button" class="mdb on" id="'+p+'-tw" onclick="mdTab(\''+p+'\',0)">Write</button>'+
    '<button type="button" class="mdb" id="'+p+'-tp" onclick="mdTab(\''+p+'\',1)">Preview</button></span></div>'+
    '<div class="mdpane" id="'+p+'-pane"><textarea id="'+p+'-text" placeholder="'+esc(ph)+'" oninput="mdLive(\''+p+'\')"></textarea>'+
    '<div class="mdprev body md" id="'+p+'-prev"><span class="dim">The preview shows here.</span></div></div>'+
    '<div class="mdcount" id="'+p+'-count"></div>';
}
function mdTab(p,i){

function mdExtOf(name,type){

/* A photo straight off a phone is megabytes; the mesh wants kilobytes, and a
 * board keeps 96 kB at most. Past 1600 pixels, 400 kB or the station's own
 * max (/api/services file.max) it is redrawn as a JPEG, smaller each step
 * until it fits. A GIF is left as it is. cb(blob, name). */
function mdShrink(f,cb){
  var cap=fileCaps.max||0;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type||''))return cb(f,f.name);
  var url;try{url=URL.createObjectURL(f);}catch(e){return cb(f,f.name);}
  var im=new Image();
  im.onerror=function(){cb(f,f.name);};
  im.onload=function(){
    var w=im.naturalWidth,h=im.naturalHeight,big=Math.max(w,h);
    try{URL.revokeObjectURL(url);}catch(e){}
    if(big<=1600&&f.size<=400000&&(!cap||f.size<=cap))return cb(f,f.name);
    var steps=[[1600,.85],[1280,.8],[1024,.75],[800,.7],[640,.65],[480,.6],[320,.55]],k=0;
    var name=(f.name||'image').replace(/\.[^.]*$/,'')+'.jpg';
    var next=function(){
      if(k>=steps.length)return cb(f,f.name);
      var s=steps[k++],r=Math.min(1,s[0]/big);
      try{
        var c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        if(!c.toBlob)return cb(f,f.name);
        c.toBlob(function(b){
          if(!b)return cb(f,f.name);
          if((cap&&b.size>cap)||(!cap&&b.size>400000))return next();
          cb(b.size<f.size?b:f,b.size<f.size?name:f.name);
        },'image/jpeg',s[1]);
      }catch(e){cb(f,f.name);}
    };
    next();
  };

}
function mdAttach(p,inp){

  mdShrink(f,function(blob,name){
    if(fileCaps.max&&blob.size>fileCaps.max)return snack('Too large for this station: '+Math.round(blob.size/1024)+' kB');
    var rd=new FileReader();
    rd.onload=function(){
      var bytes=new Uint8Array(rd.result),ref=refOf(bytes,mdExtOf(name,blob.type));
      try{mdBlobs[ref]=URL.createObjectURL(blob);}catch(e){}
      var alt=(name||'image').replace(/\.[^.]*$/,'').replace(/[\[\]()]/g,' ').slice(0,40);
      mdInsert(p,'!['+alt+']('+ref+')');

}
/* Store the bytes on the station under their reference (API-HTTP.md

function mdUpload(ref,bytes,type){
  mdUploading++;

  try{
    var x=new XMLHttpRequest();

    x.timeout=120000;

    x.onload=function(){done(x.status===200,replyWhy(x));};
    x.onerror=x.ontimeout=function(){done(false,'no answer');};

// ---- blog (XPRS.md 18): the posts the station holds, newest first --------
// A post is a t:blog packet: published, kept, listed and read later by people
// who were not listening when it went out. A long one arrives split (7.6) and
// the archive files the parts as it heard them, so the page joins them here,
// keyed on (f, ts) as 6.6 says, and a set with a part missing is not shown.
// A later post from the same author with the same title: replaces the
// earlier one (18.1): that is how a post is corrected.
var blogs=[],blogSeen={},blogAt=0;

/* One value from a wire's head (before m:), or ''. */
function headField(w,key){
  var mi=w.indexOf(' m:'),head=(mi>=0?w.slice(0,mi):w)+' ';
  var m=head.match(new RegExp(' '+key+':([^ ]+) '));return m?m[1]:'';}

 * title, newest first. Each: {id,from,ts,title,tags,file,text,edited,sig}. */
function blogPosts(rows){
  var sets={},order=[],i,r,w;
  for(i=0;i<rows.length;i++){r=rows[i];w=r.wire||'';
    if(w.indexOf('t:blog ')!==0||/ remove:/.test(w))continue;
    var n=headField(w,'n'),idx=1,of=1;
    if(n){var nm=/^([1-9])\/([1-9])$/.exec(n);if(!nm)continue;idx=+nm[1];of=+nm[2];if(idx>of)continue;}
    var key=baseCall(r.from||'')+'|'+headField(w,'ts');
    if(!sets[key]){sets[key]={row:r,of:of,parts:{},got:0};order.push(key);}
    var s=sets[key];
    /* The whole, filed by a station that joined the parts itself, outranks them. */
    if(!n&&s.of>1){s.of=1;s.parts={};s.got=0;s.row=r;}
    if(of!==s.of||s.parts[idx])continue;      /* a mixed or repeated part */
    var mi=w.indexOf(' m:');
    s.parts[idx]=mi>=0?w.slice(mi+3):'';s.got++;
    if(idx===1)s.row=r;                        /* the head carries title:, tag:, file: */
  }
  var byTitle={},list=[];
  for(i=0;i<order.length;i++){var st=sets[order[i]];
    if(st.got<st.of||!st.parts[1])continue;    /* a hole: never shown (6.6) */
    var text=[],k;for(k=1;k<=st.of;k++)text.push(st.parts[k]);
    w=st.row.wire||'';

     * without n:, the joined text. A comment names that, never a part. */
    var wholeW=st.of>1?w.replace(/ n:[1-9]\/[1-9]/,'').replace(/ m:[\s\S]*$/,'')+' m:'+text.join(' '):w;
    var p={id:wireId(wholeW),from:st.row.from||'',ts:st.row.ts||0,
           title:headField(w,'title'),tags:headField(w,'tag'),file:headField(w,'file'),
           text:text.join(' '),edited:false,sig:st.row.sig||''};

      if(q){if(q.ts>=p.ts){q.edited=true;continue;}

      byTitle[tk]=p;}
    list.push(p);
  }

// which the station signs (/api/admin). A message gone, or an author sent
// away, is taken off every page that shows them.
var stationCall='',canModerate=false,myStationRole='none',myOffer='';
var modRemoved={},modAway={};
var SAFETY={sos:1,warning:1,info:1};
function applyModeration(m){
  var i,ch=false,box=el('msgs'),k;
  for(i=0;i<(m.removed||[]).length;i++)
    if(!modRemoved[m.removed[i]]){modRemoved[m.removed[i]]=1;ch=true;}
  var away={};
  for(i=0;i<(m.away||[]).length;i++)away[m.away[i]]=1;
  for(k in away)if(!modAway[k])ch=true;
  for(k in modAway)if(!away[k])ch=true;
  modAway=away;
  if(!ch)return;
  var kids=box.querySelectorAll('.msg');
  for(i=0;i<kids.length;i++){
    var d=kids[i];
    if(modRemoved[d.getAttribute('data-id')]||modAway[d.getAttribute('data-from')])
      d.parentNode.removeChild(d);
  }
}
function loadMyRole(){
  if(!sess)return;
  getJSON('/api/admin?session='+encodeURIComponent(sess),function(d){
    if(!d||!d.ok)return;
    if(d.station)stationCall=d.station;
    myStationRole=d.role||'none';
    var was=isStationAdmin;isStationAdmin=!!d.you;stationHasAdmin=!!d.admin;
    if(isStationAdmin&&!was&&canRooms)loadRooms();
    if(curRoom==='forum')fabSet(isStationAdmin?'category':null);
    if(curRoom==='alerts')fabSet(canAlert()?'alert':null);
    myOffer=d.offer||'';
    if(myStationRole==='invited'&&myOffer&&!adminInvitedSaid){
      adminInvitedSaid=true;
      snack('You were asked to moderate '+stationCall+': see Administration');
    }
  });
}
var adminInvitedSaid=false,isStationAdmin=false,stationHasAdmin=false;
function tsAt(ms){
  var d=new Date(ms),p=function(n){return (n<10?'0':'')+n;};
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+
    '_'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
/* Sign a t:moderate about this station's rooms and post it. */
function modAct(body,done){
  if(!stationCall||!canSign())return snack('Not ready yet');
  signAny('t:moderate f:'+mycall+' d:'+stationCall+' ts:'+tsNow()+' '+body,function(w){
    if(!w)return snack('Not signed');
    postWire(w,function(ok,why){
      if(!ok){snack(why||'The station refused it');return;}
      if(done)done();
    });
  });
}
function modDelete(id){
  if(!confirm('Delete this message for everyone? This cannot be undone.'))return;
  modAct('r:'+id+' remove:message',function(){
    applyModeration({removed:[id],away:Object.keys(modAway)});
    snack('Deleted');
  });
}
function modSendAway(call,secs){
  var c=baseCall(call);
  var until=secs?' until:'+tsAt(Date.now()+secs*1000):'';
  modAct('revoke:'+c+until,function(){
    var a=Object.keys(modAway);a.push(c);
    applyModeration({removed:[],away:a});
    snack(c+' was sent away'+(secs?'':' until lifted'));
    if(tab==='admin')loadAdmin();
  });
}
function acceptModerator(){
  if(!myOffer)return;
  modAct('r:'+myOffer+' accept:mod',function(){
    snack('You moderate '+stationCall+' now');
    myOffer='';loadMyRole();setTimeout(loadAdmin,500);
  });
}
/* The browser asks the person first; it answers only on a secure page
 * (https, or localhost), so a station opened over plain http says why. */
function posFromDevice(){
  if(!navigator.geolocation)return snack('This browser cannot tell its location');
  if(!window.isSecureContext)return snack('The browser gives the location only on an https page');
  snack('Asking the browser for this device\u2019s location\u2026');
  navigator.geolocation.getCurrentPosition(function(p){
    el('ps-lat').value=p.coords.latitude.toFixed(5);el('ps-lon').value=p.coords.longitude.toFixed(5);adminDirty=true;
    snack('Location filled in: choose the radius and Save');
  },function(e){snack(e&&e.code===1?'Location not allowed':'No location from this device');},{enableHighAccuracy:true,timeout:15000});
}
function posSave(){
  var lat=parseFloat(el('ps-lat').value),lon=parseFloat(el('ps-lon').value),r=+el('ps-r').value;
  if(isNaN(lat)||isNaN(lon)||lat<-90||lat>90||lon<-180||lon>180)return snack('A latitude and a longitude, please');
  var p=posCountry&&+posCountry.lat===lat&&+posCountry.lon===lon?
    {lat:posCountry.lat,lon:posCountry.lon,r:posCountry.r}:snapPos(lat,lon,r);
  adminDirty=false;var w=posWire(p);
  adminSet({page_pos:p.lat+','+p.lon+','+p.r,pos:w.pos,acc:w.acc});
}
// ---- the mesh group (docs/plan-mesh-trust.md): its roster is the trusted
// stations. Created here, or joined by mirroring it from any member; one
// signed invitation at any of its administrators reaches every member.
function meshRoom(){for(var i=0;i<hostedRooms.length;i++)if(hostedRooms[i].kind==='mesh')return hostedRooms[i];return null;}
function meshPanel(){
  var m=meshRoom(),pills=function(label,a,on){return '<span class="pill'+(on?' on':'')+'">'+label+': '+(a&&a.length?a.map(esc).join(', '):'none')+'</span>';};
  if(!m)return '<div class="frow" style="margin-top:14px"><b>Start a mesh</b></div>'+
    '<div class="frow"><input id="mg-name" class="grow" placeholder="Its name, e.g. Valley stations">'+
    '<button class="act primary" onclick="meshCreate()">Create</button></div>'+
    '<div class="frow" style="margin-top:14px"><b>Or join one</b></div>'+
    '<div class="frow"><input id="mg-call" class="grow" placeholder="The mesh (X5&hellip;)" style="text-transform:uppercase">'+
    '<input id="mg-owner" class="grow" placeholder="A station in it (X3&hellip;)" style="text-transform:uppercase">'+
    '<button class="act primary" onclick="meshJoin()">Join</button></div>'+
    '<p class="lead">To join, ask one of its administrators to invite this station ('+esc(stationCall||'')+'), then join here and accept.</p>';
  var c=esc(m.call),role=m.station_role||'none',runs=role==='owner'||role==='mod';
  var h='<div class="frow" style="margin-top:14px"><b>'+esc(m.name)+'</b><span class="pill">'+c+'</span>'+
    '<span class="pill on">'+(role==='owner'?'held here':role==='mod'?'co-administrator':role==='member'?'member':role==='invited'?'invited':'joining')+'</span>'+
    (m.mirrored?'<span class="pill">from '+esc(m.owner||'')+'</span>':'')+'</div>';
  if(role==='invited'&&m.station_offer)
    h+='<div class="frow"><span class="lead">This station is invited to the mesh.</span><span class="sp"></span>'+
       '<button class="act primary" onclick="roomPost({action:\'accept\',call:\''+c+'\'},function(){snack(\'Accepted: this station is in the mesh\');})">Accept</button></div>';
  else if(role==='none'&&m.mirrored)
    h+='<p class="lead">Waiting for the mesh&rsquo;s record from '+esc(m.owner||'')+'. If this station was invited, Accept appears here.</p>';
  h+='<div class="pills">'+pills('Members',m.members,true)+pills('Co-administrators',m.moderators,true)+
     (m.invited&&m.invited.length?pills('Invited',m.invited):'')+'</div>';
  if(runs)h+='<div class="frow"><input id="mg-who" class="grow" placeholder="A station (X3&hellip;)" style="text-transform:uppercase">'+
     '<button class="act" onclick="meshDo(\'add\')">Invite</button>'+
     '<button class="act" onclick="meshDo(\'appoint\')">Make co-administrator</button>'+
     '<button class="act quiet" onclick="meshDo(\'remove\')">Remove</button></div>';
  h+='<div class="frow"><span class="sp"></span>'+(m.mirrored?
     '<button class="act danger" onclick="if(confirm(\'Leave the mesh? This station stops trusting its members.\'))roomPost({action:\'unmirror\',call:\''+c+'\'},function(){snack(\'Left the mesh\');})">Leave the mesh</button>':
     '<button class="act danger" onclick="if(confirm(\'Close the mesh? Its members will trust nobody through it.\'))roomPost({action:\'close\',call:\''+c+'\'},function(){snack(\'Mesh closed\');})">Close the mesh</button>')+'</div>';
  return h;
}
function meshCreate(){
  var n=(el('mg-name').value||'').trim();if(!n)return snack('A mesh needs a name');
  roomPost({action:'create',name:n,kind:'mesh',visibility:'private',posting:'members'},function(){snack('Mesh created: invite its stations');});
}
function meshJoin(){
  var c=(el('mg-call').value||'').trim().toUpperCase(),o=(el('mg-owner').value||'').trim().toUpperCase();
  if(!/^X5[A-Z0-9]{2,5}$/.test(c))return snack('The mesh is an X5 callsign');
  if(!/^X[1-4][A-Z0-9]{2,5}$/.test(o))return snack('A station in the mesh, please');
  roomPost({action:'mirror',call:c,owner:o,name:c,kind:'mesh',visibility:'private'},function(){snack('Joining: the invitation appears here within a few minutes');});
}
function meshDo(action){
  var m=meshRoom(),w=(el('mg-who').value||'').trim().toUpperCase();if(!m)return;
  if(!/^X[1-4][A-Z0-9]{2,5}$/.test(w))return snack('A station callsign, please');
  roomPost({action:action,call:m.call,member:w},function(){snack(action==='add'?'Invited '+w:action==='appoint'?w+' co-administers the mesh':w+' removed');});
}
function adminAppoint(){
  var c=(el('ad-newmod').value||'').trim().toUpperCase();
  if(!c)return;
  adminDo('appoint',{call:c});
}
function adminRelease(){
  if(!confirm('Give up administration of this station?'))return;
  adminDo('release');
}

// ---- boot: an identity before the first keystroke, the extension first ----
(function(){
  var saved=stGet('xprs_nsec');
  var b=saved?nsecDecode(saved):null;
  /* A returning visitor's key is used at once. A new one gets a key only
     once it is clear there is no extension to offer (below). */
  if(b)useKey(b);else el('call').textContent='\u2026';
  renderSide();
  switchRoom(curRoom);
  load();
  tabTimer=setInterval(tick,TAB_MS.chat);
  getJSON('/api/services',applyServices);
  /* The alerts count in the tab, whatever tab is open: once, then every
     thirty seconds (one small request; an alert read late is worth less). */
  pollAlerts();loadBlogFeed();
  alertTimer=setInterval(function(){pollAlerts();loadBlogFeed();},30000);
  /* An extension injects `window.nostr` a moment after the page starts:
     look for it for 3 s. Chosen before: use it. Declined before: the page's
     key. Never asked: ask. No extension: the page's key, made now if new. */
  var tries=0,tm=setInterval(function(){
    showExtButton();
    var choice=stGet('xprs_ext');
    if(nostrAvailable()){
      clearInterval(tm);
      if(choice==='1'){if(!extMode)useExtension(true,function(){if(!priv)useKey(randKey());});}
      else if(choice==='0'||choice===''){if(!priv)useKey(randKey());} /* '' = declined, older pages */
      else askExtension();
    }else if(++tries>12){
      clearInterval(tm);
      if(!priv&&!extMode)useKey(randKey());
    }
  },250);
})();
// See the html/body rule in the stylesheet: the document is parked one
// pixel down so Android's captive-portal browser does not take a scroll-up
// inside a panel for a pull-to-refresh. Load, resize (the keyboard) and any
// scroll that lands on 0 put it back.
function park(){
  var y=window.scrollY!==undefined?window.scrollY:document.documentElement.scrollTop;
  if(y<1)window.scrollTo(0,1);
}
// The page ends where what is visible ends: the visual viewport, which a
// toolbar lying over the page shortens (not while pinch-zoomed, when it is
// the zoomed window). And a WebView that draws under the system bars but
// reports no safe-area insets (WebViews before edge-to-edge support) is told
// the Android bars' heights: the tell is a page as tall as the whole screen,
// which a browser that keeps clear of the bars never is. A measured inset
// always wins over the guess.
function fit(){
  var de=document.documentElement,vv=window.visualViewport;
  var lay=window.innerHeight;
  var vis=vv&&Math.abs(vv.scale-1)<0.01?vv.height:lay;
  if(lay>0){
    de.style.setProperty('--lay-h',lay+'px');
    de.style.setProperty('--cut',Math.max(0,Math.round(lay-vis))+'px');
  }
  var under=('ontouchstart' in window)&&window.screen&&
            window.innerHeight>=window.screen.height-2;
  if(under&&!insetBottom()){
    de.style.setProperty('--sab','48px');de.style.setProperty('--sat','24px');
  }else{
    de.style.removeProperty('--sab');de.style.removeProperty('--sat');
  }
  park();
}
// The bottom inset the browser reports, in px. A custom property computes
// to its text ("env(...)"), so it is read off a real padding.
var insetProbe=null;
function insetBottom(){
  if(!insetProbe){
    insetProbe=document.createElement('div');
    insetProbe.style.cssText='position:fixed;visibility:hidden;'+
      'padding-bottom:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(insetProbe);
  }
  return parseFloat(getComputedStyle(insetProbe).paddingBottom)||0;
}
window.addEventListener('load',fit);
window.addEventListener('resize',fit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
window.addEventListener('scroll',park,{passive:true});
fit();
