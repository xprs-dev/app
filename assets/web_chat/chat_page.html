<!doctype html>
<!-- The hotspot chat page. SOURCE OF TRUTH: edit this file, then regenerate
     chat_page.c with tool/embed_page.py. Theme and logo font are the old
     the XPRS chat (xprs_http/chat_page.c), bubbles lean Telegram.
     Identity is created silently on first visit; the menu lets a user show
     the npub, export the nsec, import another, or start fresh. The crypto
     is the XPRS 9.1.2 short-Schnorr, validated against the spec's worked
     example. Everything inline: captive WebViews have no internet, no
     secure context, often no localStorage. -->
<html><head><meta charset="utf-8">
<!-- resizes-content: the keyboard shrinks the page instead of scrolling it,
     so the header and the room chips stay on screen while typing.
     viewport-fit=cover: where the browser draws the page under Android's
     navigation or status bar it then says how much, as safe-area insets
     (the --sa* properties below); everywhere else they are 0. -->
<meta name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-content,viewport-fit=cover">
<title>XPRS</title>

:root{--accent:#ffa86a;--bg:#0a0a0b;--text:#f2f0ee;
      --border:rgba(255,168,106,.2);--muted:#8f8a86;
      /* The rest of the palette, so a theme (Administration, Look) is one block. */
      --panel:#141312;--field:#1a1918;--line:#232120;--dim:#6b6560;--placeholder:#7a746e;
      --on-accent:#140c06;--accent-soft:rgba(255,168,106,.14);--hover:rgba(255,168,106,.08);
      --own:#ffa86a;--own-border:#ffc08f;--banner:#101010;
      --snack:#262220;--snack-text:#fff;--radius:14px;
      --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
      --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0}
/* The document never scrolls; the panels do. Android's captive-portal
   browser (CaptivePortalLogin) wraps its WebView in a swipe-to-refresh
   layout that reloads the page on any downward drag while the DOCUMENT is
   at scroll 0, whichever panel the finger is on -- so scrolling up through
   the conversation reloaded the page. The body is one pixel taller than the
   window and parked at scrollY 1 (park(), in the script): the WebView then
   reports it can scroll up and the drag stays with the panel. The document
   itself cannot be dragged (overflow:hidden), and overscroll-behavior keeps
   a panel at its end, and Chrome's own pull-to-refresh, from reaching it. */
html{height:100%;overflow:hidden;overscroll-behavior:none}
/* The body is the window's height (fit(), in the script, as --lay-h; 100%
   until it ran), and stays one pixel taller for the parking. What a
   toolbar lying over the bottom covers (Samsung Internet, Firefox: it would
   hide as the page scrolls, but this page never scrolls, so the composer
   stayed under it for good) is cut off as --cut, padding at the bottom. */
body{height:calc(100% + 1px);height:calc(var(--lay-h,100%) + 1px);
     padding:1px var(--sar) var(--cut,0px) var(--sal);overflow:hidden;
     overscroll-behavior:none}
.messages,.view,#side{overscroll-behavior:contain}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;
     background:var(--bg);color:var(--text);font-size:14px;
     display:flex;flex-direction:column}
.header{border-bottom:1px solid var(--border);height:40px;
        padding:0 12px;margin-top:calc(5px + var(--sat));
        display:flex;align-items:center;gap:12px;position:relative}
.header .logo{font-family:'Wartext',sans-serif;font-size:38px;
        color:var(--accent);letter-spacing:5px;margin-top:-12px;
        transform:scaleY(.72);transform-origin:center}
.header .stcall{color:var(--muted);font-size:13px;letter-spacing:1px;
        margin-left:-6px;white-space:nowrap}
.menu{margin-left:auto;position:relative}
.my-callsign{color:var(--accent);font-size:12px;font-weight:bold;
        margin-right:8px}
.menu-btn{background:transparent;border:1px solid var(--border);
        color:var(--text);padding:6px 8px;border-radius:4px;cursor:pointer;
        font-size:16px;line-height:1}
/* The menu is a drawer from the right, the room list's twin: full height,
   grouped, over a dimmed page. */
.menu-panel{position:fixed;right:0;top:0;bottom:0;width:min(78vw,300px);z-index:30;
        background:var(--bg);border-left:1px solid var(--border);overflow-y:auto;
        padding:calc(10px + var(--sat)) 0 calc(10px + var(--sab));
        transform:translateX(102%);transition:transform .22s ease;
        box-shadow:-4px 0 24px rgba(0,0,0,.5);text-align:left}
.menu-panel.open{transform:none}
.menu-panel button{display:block;width:100%;background:transparent;border:0;
        color:var(--muted);padding:11px 16px;text-align:left;cursor:pointer;
        font:inherit;font-size:15px}
.menu-panel button:hover{background:var(--hover);color:var(--text)}
.menu-panel .menu-sec{font-size:10px;color:var(--dim);text-transform:uppercase;
        letter-spacing:1px;padding:12px 16px 4px}
#menubg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:29;
        opacity:0;pointer-events:none;transition:opacity .22s}
#menubg.open{opacity:1;pointer-events:auto}
/* ---- panel kit: Administration, Alerts, and every form inside a view ----
   One look for everything a visitor fills in, on the chat's own palette:
   dark fields with an accent focus ring, accent radios, three button
   weights (outlined, filled, quiet), cards, pills, and roster rows. */
.view h3{margin:18px 0 8px}
/* Settings and alerts read as a column, not a banner, on a wide screen. */
#v-admin>*{max-width:820px;margin-left:auto;margin-right:auto}
.galbar{display:flex;align-items:center;gap:10px;margin:4px auto 10px}
.galtitle{font-size:20px;font-weight:600;color:var(--text);letter-spacing:.2px}
.galabout{color:var(--muted);margin:-4px auto 14px}
.galempty{text-align:center;color:var(--muted);padding:40px 10px;font-size:40px}.galempty p{font-size:14px;margin-top:10px}
.galcats{display:flex;flex-direction:column;gap:8px}
.galcat{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}
.galcat:hover{border-color:var(--accent);background:var(--hover)}
.galcat b{display:block;color:var(--text)}.galcat span{color:var(--muted);font-size:13px}
.galcat-icon{width:46px;height:46px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px}
.galcat-icon .galfolder{width:30px}.galchev{color:var(--dim);font-size:24px}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:6px auto 16px}
.galcard{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;color:var(--text);transition:transform .15s,border-color .15s}
.galcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.galcard>img,.galnone,.galart{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--field)}
.galfolders-gallery .galcard>img,.galfolders-gallery .galart{aspect-ratio:4/3}
.galover{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff}
.galover b{display:block;font-size:15px}.galover span{font-size:12px;opacity:.85}
.galcard>.galike{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;border:0}
.galphotos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
.galphotos .galcard{border-radius:4px;border:0}.galphotos .galcard:hover{transform:none;filter:brightness(1.08)}
.galphotos .galcard>.galike{opacity:0;transition:opacity .15s}.galphotos .galcard:hover>.galike,.galphotos .galike.on{opacity:1}
.galart{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;padding:12px;text-align:center}

<script>
"use strict";
// XPRS crypto for the hotspot chat page: sha256, secp256k1 (native BigInt),
// the section 9.1.2 short-Schnorr, base85 and bech32. No dependencies -- a
// captive-portal WebView has no secure context and no WebCrypto.subtle.

// ---- sha256 (bytes in, bytes out) ----
function sha256(data){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=data.length, buf=new Uint8Array(((l+9+63)>>6)<<6);
  buf.set(data); buf[l]=0x80;
  var bl=l*8;
  buf[buf.length-4]=(bl>>>24)&255; buf[buf.length-3]=(bl>>>16)&255;
  buf[buf.length-2]=(bl>>>8)&255; buf[buf.length-1]=bl&255;
  var w=new Array(64);
  for(var off=0;off<buf.length;off+=64){
    for(var i=0;i<16;i++) w[i]=(buf[off+4*i]<<24)|(buf[off+4*i+1]<<16)|(buf[off+4*i+2]<<8)|buf[off+4*i+3];
    for(i=16;i<64;i++){
      var a1=w[i-15], b1=w[i-2];
      var s0=((a1>>>7)|(a1<<25))^((a1>>>18)|(a1<<14))^(a1>>>3);
      var s1=((b1>>>17)|(b1<<15))^((b1>>>19)|(b1<<13))^(b1>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      var ch=(e&f)^(~e&g);
      var t1=(h+S1+ch+K[i]+w[i])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var mj=(a&b)^(a&c)^(b&c);
      var t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out=new Uint8Array(32);
  for(i=0;i<8;i++){out[4*i]=(H[i]>>>24)&255;out[4*i+1]=(H[i]>>>16)&255;out[4*i+2]=(H[i]>>>8)&255;out[4*i+3]=H[i]&255;}
  return out;
}

// ---- byte/bigint helpers ----
function b2n(b){var v=0n;for(var i=0;i<b.length;i++)v=(v<<8n)|BigInt(b[i]);return v;}
function n2b(v,len){var out=new Uint8Array(len);for(var i=len-1;i>=0;i--){out[i]=Number(v&255n);v>>=8n;}return out;}
function cat(){var n=0,i,a=arguments;for(i=0;i<a.length;i++)n+=a[i].length;
  var out=new Uint8Array(n),o=0;for(i=0;i<a.length;i++){out.set(a[i],o);o+=a[i].length;}return out;}
function s2b(s){var out=new Uint8Array(s.length);for(var i=0;i<s.length;i++)out[i]=s.charCodeAt(i)&255;return out;}
function hex(b){var s='';for(var i=0;i<b.length;i++)s+=('0'+b[i].toString(16)).slice(-2);return s;}

// ---- secp256k1 (Jacobian double-and-add; one-shot signing, speed is fine) ----
var P=2n**256n-2n**32n-977n;
var N=0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
var GX=0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n;
var GY=0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8n;
function mod(a,m){var r=a%m;return r<0n?r+m:r;}
function powmod(b,e,m){var r=1n;b=mod(b,m);while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n;}return r;}
function inv(a,m){return powmod(mod(a,m),m-2n,m);}
// Jacobian points [X,Y,Z]; infinity Z=0
function jdbl(p){var X=p[0],Y=p[1],Z=p[2];if(Z===0n)return p;
  var A=X*X%P,B=Y*Y%P,C=B*B%P;
  var D=mod(2n*((X+B)*(X+B)%P-A-C),P);
  var E=3n*A%P,F=E*E%P;
  var X3=mod(F-2n*D,P);
  return [X3,mod(E*(D-X3)-8n*C,P),mod(2n*Y*Z,P)];}
function jadd(p,q){if(p[2]===0n)return q;if(q[2]===0n)return p;
  var Z1Z1=p[2]*p[2]%P,Z2Z2=q[2]*q[2]%P;
  var U1=p[0]*Z2Z2%P,U2=q[0]*Z1Z1%P;
  var S1=p[1]*Z2Z2%P*q[2]%P,S2=q[1]*Z1Z1%P*p[2]%P;
  if(U1===U2)return S1===S2?jdbl(p):[0n,1n,0n];
  var H=mod(U2-U1,P),I=4n*H*H%P,J=H*I%P,r=mod(2n*(S2-S1),P),V=U1*I%P;
  var X3=mod(r*r-J-2n*V,P);
  return [X3,mod(r*(V-X3)-2n*S1*J,P),mod(2n*H*p[2]%P*q[2],P)];}
function jmul(k,px,py){var r=[0n,1n,0n],q=[px,py,1n];
  while(k>0n){if(k&1n)r=jadd(r,q);q=jdbl(q);k>>=1n;}return r;}
function jaff(p){if(p[2]===0n)return null;var zi=inv(p[2],P),zi2=zi*zi%P;
  return [p[0]*zi2%P,p[1]*zi2%P*zi%P];}
function mulG(k){return jaff(jmul(mod(k,N),GX,GY));}

// ---- tagged hash: sha256(sha256(tag)||sha256(tag)||msg) ----
function tagged(tag,msg){var th=sha256(s2b(tag));return sha256(cat(th,th,msg));}

// ---- XPRS short-Schnorr (9.1.2) ----
/* The packet's bytes are UTF-8 (section 4), not the low byte of each UTF-16
 * unit: s2b is for the ASCII it was written for (tags, hex), and signing "e
 * with an accent" through it hashed different bytes than every verifier does. */
function u8(s){
  if(typeof TextEncoder!=='undefined')return new TextEncoder().encode(s);
  var u=unescape(encodeURIComponent(s)),b=new Uint8Array(u.length);
  for(var i=0;i<u.length;i++)b[i]=u.charCodeAt(i);return b;}
function xprsSign(canonicalStr,dPriv,aux){
  var digest=sha256(u8(canonicalStr));
  var d=mod(dPriv,N); if(d===0n) throw 'bad key';
  var Pt=mulG(d);
  if(Pt[1]&1n){d=N-d;Pt=mulG(d);}
  var px=n2b(Pt[0],32);
  var k=b2n(tagged('XPRS/nonce',cat(n2b(d,32),digest,aux)));
  k=mod(k,N); if(k===0n)k=1n;
  var R=mulG(k);
  var rx=n2b(R[0],32);
  var e32=tagged('XPRS/challenge',cat(rx,px,digest));
  var e=b2n(e32.slice(0,16));
  var s=mod(k+e*d,N);
  return cat(e32.slice(0,16),n2b(s,32));
}

// ---- base85, the spec alphabet ----
var B85='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ.-+=^!/*?&<>()[]%$#@,;_';
function b85enc(bytes){var out='';
  for(var i=0;i<bytes.length;i+=4){
    var v=(bytes[i]*16777216)+(bytes[i+1]*65536)+(bytes[i+2]*256)+bytes[i+3];
    var d=['','','','',''];
    for(var j=4;j>=0;j--){d[j]=B85[v%85];v=Math.floor(v/85);}
    out+=d.join('');}

/* Every reference the text names, images and files, in order, once each. */
function mdRefs(text){
  var out=[],seen={},re=/\]\(([A-Za-z0-9_-]{43}\.[a-z0-9]{1,8}|[0-9a-f]{64}\.[a-z0-9]{1,8})\)/g,m;
  while((m=re.exec(String(text||''))))if(!seen[m[1]]){seen[m[1]]=1;out.push(m[1]);}
  return out;}
/* One line of text -> HTML. opts.img(ref, alt) and opts.file(ref, label) draw
 * the references; opts.mention(call) an @CALL (7.5.2). */
function mdInline(s,opts){
  var keep=[],put=function(h){keep.push(h);return '\u0000'+(keep.length-1)+'\u0000';};
  s=String(s).replace(/\u0000/g,'');
  s=s.replace(/`([^`]+)`/g,function(_,c){return put('<code>'+mdEsc(c)+'</code>');});
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,function(all,alt,r){
    if(!isRef(r))return all;
    return put(isImageRef(r)&&opts.img?opts.img(r,alt):opts.file?opts.file(r,alt||r):mdEsc(all));});
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(all,label,u){
    if(isRef(u))return put(opts.file?opts.file(u,label):mdEsc(label));
    if(!/^https?:\/\/[^\s<>"']+$/i.test(u))return all;
    return put('<a href="'+mdEsc(u)+'" target="_blank" rel="noopener nofollow">'+mdEmph(mdEsc(label))+'</a>');});
  s=s.replace(/\bhttps?:\/\/[^\s<>"'()\u0000]+[^\s<>"'().,;:!?\u0000]/gi,function(u){
    return put('<a href="'+mdEsc(u)+'" target="_blank" rel="noopener nofollow">'+mdEsc(u)+'</a>');});
  if(opts.mention)s=s.replace(/(^|[^A-Za-z0-9_@])@([A-Z0-9][A-Z0-9\/-]*[A-Z0-9]|[A-Z0-9])(?![a-z])/g,
    function(_,pre,c){return pre+put(opts.mention(c));});
  s=mdEmph(mdEsc(s));
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return keep[+i];});
}
/* Emphasis on escaped text: **bold**, *italic*, _italic_ (not inside a word,
 * so snake_case stays), ~~strike~~. */
function mdEmph(s){
  return s.replace(/\*\*(?=\S)([^*]*?\S)\*\*/g,'<strong>$1</strong>')
    .replace(/~~(?=\S)([^~]*?\S)~~/g,'<del>$1</del>')
    .replace(/(^|[^*\w])\*(?=\S)([^*]*?\S)\*(?![*\w])/g,'$1<em>$2</em>')
    .replace(/(^|[^\w])_(?=\S)([^_]*?\S)_(?!\w)/g,'$1<em>$2</em>');
}
/* The whole text -> HTML blocks. */
function mdRender(text,opts){
  opts=opts||{};
  var lines=String(text||'').replace(/\r\n?/g,'\n').replace(/ ?\u2029 ?/g,'\n\n').replace(/ ?\u2028 ?/g,'\n').split('\n');
  var out=[],para=[],list=null,quote=[],i,l,m;
  var inl=function(t){return mdInline(t,opts);};
  function flush(){
    if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[];}
    if(list){out.push('<'+list.tag+'>'+list.items.map(function(x){return '<li>'+inl(x)+'</li>';}).join('')+'</'+list.tag+'>');list=null;}
    if(quote.length){out.push('<blockquote>'+quote.map(inl).join('<br>')+'</blockquote>');quote=[];}
  }
  for(i=0;i<lines.length;i++){
    l=lines[i].replace(/^\s+|\s+$/g,'');
    if(!l){flush();continue;}
    if((m=/^(#{1,3})\s+(.+)$/.exec(l))){flush();out.push('<h'+(m[1].length+2)+'>'+inl(m[2])+'</h'+(m[1].length+2)+'>');continue;}
    if(/^(?:-{3,}|\*{3,}|_{3,})$/.test(l)){flush();out.push('<hr>');continue;}
    if((m=/^>\s?(.*)$/.exec(l))){if(para.length||list)flush();quote.push(m[1]);continue;}
    if((m=/^[-*+]\s+(.+)$/.exec(l))||(m=/^\d{1,3}[.)]\s+(.+)$/.exec(l))){
      var tag=/^\d/.test(l)?'ol':'ul';
      if(para.length||quote.length||(list&&list.tag!==tag))flush();
      if(!list)list={tag:tag,items:[]};
      list.items.push(m[1]);continue;}
    if(list||quote.length)flush();
    para.push(l);
  }
  flush();
  return out.join('');
}


// ---- storage: localStorage -> cookie -> memory (captive WebViews) ----
var mem={};
function stGet(k){
  try{var v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}
  var m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));
  if(m)return decodeURIComponent(m[1]);
  return mem[k]!==undefined?mem[k]:null;}
function stSet(k,v){
  try{localStorage.setItem(k,v);}catch(e){}
  try{document.cookie=k+'='+encodeURIComponent(v)+'; max-age=31536000; path=/';}catch(e){}
  mem[k]=v;}

// ---- identity ----
// A NOSTR extension, when the browser has one, is offered first (and asked
// once, see askExtension); otherwise a key is made silently on the first
// visit. The menu changes either.
var priv=null,npub='',mycall='';
function useKey(bytes){
  hideExtAsk();
  priv=bytes;extMode=false;extPub='';
  npub=npubEncode(pubkeyX(priv));
  mycall=callsignFromNpub(npub);
  /* A new key is a new callsign: the old session proves nothing for it. */
  sess='';identSent=0;
  if(canSession)setTimeout(function(){ensureSession(0);},0);
  stSet('xprs_nsec',nsecEncode(priv));
  document.getElementById('call').textContent=mycall;
}
function randKey(){
  var b=new Uint8Array(32);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);
  else for(var i=0;i<32;i++)b[i]=Math.floor(Math.random()*256);
  return (b2n(b)===0n||b2n(b)>=N)?randKey():b;}
function showNpub(){toggleMenu();prompt('Your public key (share freely):',npub);}
function exportNsec(){toggleMenu();
  if(extMode){snack('Your key is in your extension');return;}
  prompt('Your SECRET key. Anyone holding it IS '+mycall+':',nsecEncode(priv));}
function importNsec(){toggleMenu();
  var v=prompt('Paste an nsec to become that identity:');
  if(!v)return;
  var b=nsecDecode(v.trim());
  if(!b||b2n(b)===0n||b2n(b)>=N){snack('That is not a valid nsec');return;}
  useKey(b);identSent=0;seen={};
  document.getElementById('msgs').innerHTML='';
  snack('Now chatting as '+mycall);load();}
function newIdentity(){toggleMenu();
  useKey(randKey());identSent=0;seen={};
  document.getElementById('msgs').innerHTML='';
  snack('New identity: '+mycall);load();}

// ---- XPRS wires ----
function tsNow(){
  var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+
    '_'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
function aux32(){var b=new Uint8Array(32);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);
  else for(var i=0;i<32;i++)b[i]=Math.floor(Math.random()*256);return b;}
function signWire(canonical){
  var sig=' sig:'+b85enc(xprsSign(canonical,b2n(priv),aux32()));
  var i=canonical.indexOf(' m:');
  if(i>=0)return canonical.slice(0,i)+sig+canonical.slice(i);
  return canonical+sig;}

// ---- the account in a NOSTR extension ---------------------------------------
//
// With an extension (NIP-07) the account is the same on every station: the
// callsign comes from its public key, packets are signed by it in the second
// form of XPRS.md 6.1.3 (the extension may ask each time), and direct messages
// are sealed and opened by its nip04. Its key never reaches this page.
var extMode=false,extPub='';
function canSign(){return extMode||!!priv;}
/* Sign [canonical] with whatever holds the key: cb(wire) or cb(null,why). */
function signAny(canonical,cb){
  if(extMode)nostrSignWire(canonical,extPub,cb);
  else cb(signWire(canonical));
}
function showExtButton(){
  var b=el('extbtn');
  if(!b)return;
  b.style.display=(nostrAvailable()||extMode)?'':'none';
  b.textContent=extMode?'Use the key in this page':'Use my NOSTR extension';
  tidyMenu();
}
function toggleExtension(){
  toggleMenu();
  if(extMode){
    extMode=false;extPub='';stSet('xprs_ext','0');
    var saved=stGet('xprs_nsec'),b=saved?nsecDecode(saved):null;
    useKey(b||randKey());showExtButton();rerenderAll();
    snack('Now chatting as '+mycall);
    return;
  }
  useExtension(false);
}
/* [failed] runs when the extension is missing, refuses or gives no key. */
function useExtension(quiet,failed){
  var no=function(why){if(!quiet)snack(why);if(failed)failed();};
  if(!nostrAvailable()){no('No NOSTR extension found');return;}
  var fin=function(h){
    var pub=typeof h==='string'&&h.length===64?unhexBytes(h):null;
    if(!pub){no('The extension gave no usable key');return;}
    hideExtAsk();
    extMode=true;extPub=h;priv=null;
    npub=npubEncode(pub);mycall=callsignFromNpub(npub);
    stSet('xprs_ext','1');
    sess='';identSent=0;
    el('call').textContent=mycall;
    showExtButton();rerenderAll();
    if(canSession)ensureSession(0);
    if(!quiet)snack('Now chatting as '+mycall+' through your extension');
  };
  try{
    var r=window.nostr.getPublicKey();
    if(r&&r.then)r.then(fin,function(){no('The extension refused');});
    else fin(r);
  }catch(e){no('The extension refused');}
}
/* The visitor has not chosen yet (xprs_ext unset) and an extension is here:
   ask, with the extension as the default answer. A first-time visitor has no
   key until they answer; one who already has a key here may keep it. */
function askExtension(){
  el('extno').textContent=priv?'Keep '+mycall+', the key in this page':'Make a new key in this page';
  el('extask').style.display='';
  try{el('extyes').focus();}catch(e){}
}
function hideExtAsk(){var a=el('extask');if(a)a.style.display='none';}
function answerExt(yes){
  hideExtAsk();
  var keep=function(){
    if(!priv)useKey(randKey());
    showExtButton();rerenderAll();
  };
  if(!yes){stSet('xprs_ext','0');keep();snack('Chatting as '+mycall);return;}
  /* The extension may ask its own question now; if it says no, the page
     keeps (or makes) its own key, and the menu can try again later. */
  useExtension(false,keep);
}
/* The room again from what was heard, under the key now in use. */
function rerenderAll(){plainCache={};switchRoom(curRoom);load();}
var plainCache={};            /* wire id -> opened text, or false */

// ---- who we may talk to privately ----------------------------------------
//
// A direct message is sealed to the peer's key (XPRS.md 6.2) when the station
// has one for them, and sent in the clear, and marked so, when it has not.
// A key is believed only from an identity the station VERIFIED: anyone can
// write an identity for somebody else's callsign.
var keys={};                 /* base callsign -> x-only public key, found ones only */
var keyMiss={};              /* base callsign -> when a lookup last found nothing */
var keyWait={};              /* base callsign -> callbacks waiting for it */
function npubDecode(str){var d=bech32Decode(str);
  if(!d||d.hrp!=='npub')return null;var b=to8(d.data);
  return b.length===32?b:null;}
function fetchKey(call,cb){
  var c=baseCall(call);
  if(keys[c]){cb(keys[c]);return;}
  if(keyWait[c]){keyWait[c].push(cb);return;}
  keyWait[c]=[cb];
  getJSON('/api/xprs/history?kind=identity&call='+encodeURIComponent(c)+'&limit=3',
    function(d){
      var k=null,rows=(d&&d.rows)||[],i,m;
      for(i=0;i<rows.length&&!k;i++){
        if(rows[i].sig!=='verified')continue;
        m=(rows[i].wire||'').match(/ k:(npub1[0-9a-z]+)/);
        if(m)k=npubDecode(m[1]);
      }
      /* Not found is not remembered as a fact: the identity may arrive next. */
      if(k)keys[c]=k;else keyMiss[c]=Date.now();
      var w=keyWait[c];delete keyWait[c];
      for(i=0;i<w.length;i++)w[i](k);
    });
}

// ---- a session: proof of the key behind our callsign -----------------------
//
// A station that offers mail to visitors (page.session in /api/services) gives
// a one-time nonce; we sign it, and it then shows us the direct messages
// addressed to this callsign and no one else's. Anyone can write any callsign;
// only the key signs.
var sess='',canSession=false;
/* A file by reference, as this visitor may have it: a file posted in a
 * private room is served to its members (XPRS.md 11.2), so the session goes
 * with the ask. */
function fileUrl(ref){return '/api/xprs/file/'+ref+(sess?'?session='+encodeURIComponent(sess):'');}
/* The hosted room the open conversation is, for an upload to name. */
function fileRoom(){
  var k=curRoom.slice(0,2),c=k==='g:'||k==='f:'?curRoom.slice(2):'';
  return c&&hostedByCall[c]?c:'';
}
function ensureSession(tries){
  if(!canSession||sess||!canSign())return;
  sendIdentity();
  getJSON('/api/session',function(d){
    if(!d||!d.nonce)return;
    signAny('t:session f:'+mycall+' ts:'+tsNow()+' m:'+d.nonce,function(w){
      if(!w)return;
      var x=new XMLHttpRequest();
      x.open('POST','/api/session',true);
      x.timeout=6000;
      x.onload=function(){
        var j=null;try{j=JSON.parse(x.responseText);}catch(e){}
        if(x.status===200&&j&&j.session){
          sess=j.session;chatLoaded=false;chatDeep=false;load();
          onSession(j);
          if(tab==='admin')loadAdmin();
          if(canModerate)loadMyRole();
          if(canRooms)loadRooms();
        }
        else if(x.status===409&&(tries||0)<4)
          /* The station has not heard our identity yet. */
          setTimeout(function(){ensureSession((tries||0)+1);},1500);
      };
      x.send(JSON.stringify({wire:w}));
    });
  });
}

// ---- sending: POST -> GET -> Image() (hostile WebViews) ----
function postWire(wire,cb){
  var done=false;
  function fin(ok,why){if(!done){done=true;if(cb)cb(ok,why);}}
  try{
    var x=new XMLHttpRequest();
    x.open('POST','/api/xprs/send',true);
    x.timeout=4000;
    x.onload=function(){fin(x.status===200,x.status===200?'':replyWhy(x));};
    x.onerror=x.ontimeout=function(){getFallback(wire,fin);};
    x.send(JSON.stringify({wire:wire}));
  }catch(e){getFallback(wire,fin);}
}
/* The station's own words for a refusal: {"ok":false,"error":"..."}. */
function replyWhy(x){
  try{return JSON.parse(x.responseText).error||('HTTP '+x.status);}
  catch(e){return 'HTTP '+x.status;}}
function getFallback(wire,fin){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','/api/xprs/send?wire='+encodeURIComponent(wire),true);
    x.timeout=4000;
    x.onload=function(){fin(x.status===200,x.status===200?'':replyWhy(x));};
    x.onerror=x.ontimeout=function(){
      try{new Image().src='/api/xprs/send?wire='+encodeURIComponent(wire);}catch(e){}
      fin(true);};
    x.send();
  }catch(e){fin(false);}
}

var identSent=0;
/* ---- the station as this visitor's mailbox (XPRS.md 9.12, 12.8.3) ------
   The session reply says who holds this callsign's mail (`holders`), whether
   this station offers to (`offer`: it has no holder yet and the station has
   room) and how much waits here (`mail`). Only the visitor's own key may say
   where their mail goes (9.12: a forged declaration collects somebody else's
   mail), so the PAGE signs the declaration naming the station, once, and
   again when the station differs or the declaration is a week from its
   until:. The station serves the visitor from the moment it offers; the
   declaration is what every other archiver learns from. */
var sessHolders=null;
function tsPlus(sec){
  var d=new Date(Date.now()+sec*1000),p=function(n){return (n<10?'0':'')+n;};
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+
    '_'+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}
function onSession(j){
  sessHolders=j.holders||null;
  if(j.offer&&canSign()){
    var rec=null;try{rec=JSON.parse(stGet('xprs_mbox')||'null');}catch(e){}
    var stale=!rec||rec.station!==j.offer||!rec.at||Date.now()-rec.at>23*86400000;
    if(stale){
      signAny('t:mailbox f:'+mycall+' ts:'+tsNow()+' hold:'+j.offer+' until:'+tsPlus(30*86400),function(w){
        if(!w)return;
        postWire(w,function(ok){
          if(ok){stSet('xprs_mbox',JSON.stringify({station:j.offer,at:Date.now()}));
                 sessHolders=[j.offer];if(tab==='station')loadStation();}
        });
      });
    }
  }
  /* Mail that waited while this browser was closed: older than the chat
     window's first page, so asked for by name, once per session. */
  if(j.mail>0)getJSON('/api/xprs/mail?call='+encodeURIComponent(mycall)+'&session='+sess,function(d){
    var rows=(d&&d.rows||[]).slice().reverse();
    for(var i=0;i<rows.length;i++)render(rows[i]);
  });
}
/* ---- receipts (XPRS.md 9.7.1, 12.8.2) -----------------------------------
   A message addressed to this callsign is acknowledged once, when it reaches
   this device: the holders release their copies on the signed receipt, and
   the sender learns it arrived. The ids acknowledged are remembered so a
   reload does not thank twice. */
var ackedIds=null;
function ackOnce(row,id){
  if(!canSign()||!id)return;
  if(ackedIds===null){try{ackedIds=JSON.parse(stGet('xprs_acked')||'[]');}catch(e){ackedIds=[];}}
  if(ackedIds.indexOf(id)>=0)return;
  ackedIds.push(id);while(ackedIds.length>200)ackedIds.shift();
  stSet('xprs_acked',JSON.stringify(ackedIds));
  signAny('t:receipt f:'+mycall+' d:'+baseCall(row.from)+' ts:'+tsNow()+' r:'+id+' s:ack',function(w){
    if(w)postWire(w,null);});
}
function sendIdentity(){
  var now=Date.now();
  if(now-identSent<86400000)return;
  identSent=now;
  signAny('t:identity f:'+mycall+' ts:'+tsNow()+' k:'+npub,function(w){
    if(w)postWire(w,null);});
}
function sendMsg(){
  var t=document.getElementById('txt');
  var text=t.value.trim();
  if(!text||!canSign()||curRoom==='alerts')return;
  sendIdentity();
  /* A forum comment is a t:blog: formatted text (XPRS.md 4.11), its lines kept. */
  if(curRoom.slice(0,2)==='f:'){t.value='';cancelReply();forumReply(mdToWire(text));return;}
  text=text.replace(/[\x00-\x1f]/g,' ');
  var thread='';
  if(replyTo){
    if(replyTo.root)thread=' root:'+replyTo.root;
    thread+=' r:'+replyTo.id;
  }
  var where='';
  if(curRoom==='local')where=' scope:local';
  else if(curRoom==='regional')where=' scope:regional';
  else if(curRoom.slice(0,3)==='dm:')where=' d:'+curRoom.slice(3);
  else if(curRoom.slice(0,2)==='g:')where=' d:'+curRoom.slice(2);
  /* The Social feed publishes a status (27): kept and read later, not a
   * conversation. A reply to a status is itself a status carrying r:. */
  var typ=curRoom==='social'?'t:status':'t:message';
  var peer=curRoom.slice(0,3)==='dm:'?curRoom.slice(3):'';
  t.value='';
  cancelReply();
  /* A direct message is sealed to the peer's key by default (XPRS.md 6.2);
     clear text is the visitor's choice for the conversation, and the only
     form amateur bands allow (6.4). Never in the clear by accident. */
  if(peer&&!dmClear[peer])fetchKey(peer,function(k){
    if(!k&&!confirm('No key is known for '+peer+' yet, so this cannot be sealed. Send it in clear text?')){
      t.value=text;return;}
    dispatch(k);});
  else dispatch(null);
  function dispatch(k){
    if(!k){finish(null);return;}
    if(extMode)nostrSeal(hex(k),text,finish);
    else finish(sealBody(priv,k,text));
  }
  function finish(sealedBody){
    var head=typ+' f:'+mycall+' ts:'+tsNow()+where+thread;
    signAny(sealedBody?head+' x:'+sealedBody:head+' m:'+text,function(wire,why){
      if(!wire){snack('Not sent: '+(why||'not signed'));t.value=text;return;}
      /* The station re-airs this on its radios with its own via: (XPRS.md
         9, 12.8.3 step 4): leave it the room, or a full packet goes out
         bare and neighbours take the visitor for a station in the room. */
      if(u8(wire).length>250-(stationCall?5+stationCall.length:0)){snack('Message too long');t.value=text;return;}

      sendOut(wire,text,!!sealedBody,peer);
    });
  }
}
function sendOut(wire,text,sealed,peer){
  /* On the screen immediately -- the archive round trip (index writer +
   * the next poll) takes seconds, and a sender should not wait on it.
   * The wire is archived verbatim, so marking it seen dedups the echo. */
  var mine=render({from:mycall,ts:Math.floor(Date.now()/1000),sig:'verified',
          to:peer||(curRoom.slice(0,2)==='g:'?curRoom.slice(2):''),
          wire:wire,plain:text,sealed:sealed});
  postWire(wire,function(ok,why){
    if(ok)return;
    /* Said on the bubble, where it stays, and not only in a snackbar that
     * is gone in three seconds: a bubble that still reads "signed" after the
     * station refused it looks delivered. The station names its reason, e.g.
     * "refused: use:listed" (XPRS 11.9: it carries only for listed people). */
    var text=/^refused: use:/.test(why||'')?
      'Not sent: this station only carries messages for people its owner listed':
      'Not sent'+(why?' ('+why+')':'');
    if(mine){
      mine.className+=' failed';
      var b=mine.querySelector('.badge');
      if(b){b.className='badge bad';b.textContent='not sent';}
      var w=document.createElement('div');
      w.className='why';w.textContent=text;
      mine.appendChild(w);
    }
    snack(text);});
}

// ---- receiving ----
var seen={};
// Section 5 identifier: sha256 over the wire with sig: and via: removed,
// first six hex characters. What r: and root: point at.
function wireId(w){
  var canon=w.replace(/ sig:[!-~]{60}/,'').replace(/ via:[A-Za-z0-9,\-]+/,'');
  return hex(sha256(u8(canon))).slice(0,6);}  /* UTF-8, as every station hashes it */

// Replying (XPRS 6.4): r: names the parent; below the first level root:
// names the thread. idmap lets the quote show who said what.
var idmap={};
var replyTo=null;   /* {id, root, from, snip} */
function startReply(id){
  var p=idmap[id];
  replyTo={id:id,
           root:(p&&p.root)||(p&&p.r)||'',
           from:p?p.from:id, snip:p?p.text.slice(0,40):''};
  document.getElementById('replyinfo').textContent=
    'Replying to '+replyTo.from+': '+replyTo.snip;
  document.getElementById('replybar').className='on';
  document.getElementById('txt').focus();}
function cancelReply(){
  replyTo=null;
  document.getElementById('replybar').className='';}

/* New-message notice: a short beep (WebAudio -- no secure context needed,
 * but it must be unlocked by a user gesture), a title counter cleared on
 * focus, and a vibration where the device has one. */
var sndOn=stGet('xprs_sound')!=='0';
var audioCtx=null,unread=0,baseTitle=document.title;
function unlockAudio(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
document.addEventListener('click',unlockAudio);
document.addEventListener('keydown',unlockAudio);
function beep(){
  if(!sndOn||!audioCtx)return;
  try{
    var o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(.15,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.15);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+.15);
  }catch(e){}}
function notice(){
  beep();
  if(navigator.vibrate)try{navigator.vibrate(80);}catch(e){}
  if(document.hidden||!document.hasFocus()){
    unread++;document.title='('+unread+') '+baseTitle;}}
window.addEventListener('focus',function(){
  unread=0;document.title=baseTitle;});
function toggleSound(){
  sndOn=!sndOn;stSet('xprs_sound',sndOn?'1':'0');
  document.getElementById('sndbtn').textContent='Sound: '+(sndOn?'on':'off');
  toggleMenu();}

/* ---- likes (XPRS 6.5): add:like / remove:like on a message's id ---- */
var likes={};        /* msgId -> {callsign:1} */
var domById={};      /* msgId -> bubble meta element to refresh */
var myLikes={};      /* msgId -> 1 (mine, for toggling) */
function likeCount(id){var n=0;for(var k in likes[id]||{})n++;return n;}
function refreshLikes(id){
  var el=domById[id];if(!el)return;
  var n=likeCount(id);
  el.textContent=n?('\u2665 '+n):'';}
function applyReaction(row){
  var w=row.wire||'';
  var rm=w.match(/ r:([0-9a-f]{6})/);
  if(!rm)return;
  var id=rm[1],from=baseCall(row.from||'');
  if(!likes[id])likes[id]={};
  if(/ add:like/.test(w)){likes[id][from]=1;}
  else if(/ remove:like/.test(w)){delete likes[id][from];}
  if(from===baseCall(mycall))myLikes[id]=/ add:like/.test(w)?1:0;
  refreshLikes(id);}
function sendLike(id){
  var verb=myLikes[id]?'remove':'add';
  myLikes[id]=verb==='add'?1:0;
  if(!likes[id])likes[id]={};
  if(verb==='add')likes[id][baseCall(mycall)]=1;
  else delete likes[id][baseCall(mycall)];
  refreshLikes(id);
  var par=idmap[id];
  var sc=par&&par.scope&&par.scope!=='global'?' scope:'+par.scope:'';
  signAny('t:reaction f:'+mycall+' ts:'+tsNow()+sc+' '+verb+':like r:'+id,function(wire){
    if(wire)postWire(wire,null);});}

/* ---- the per-message menu ---- */
function showMsgMenu(ev,id,from,own){
  var m=document.getElementById('msgmenu');
  var items='<button onclick="menuAct(\'reply\',\''+id+'\',\''+from+'\')">Reply</button>'+
    '<button onclick="menuAct(\'like\',\''+id+'\',\''+from+'\')">'+
      (myLikes[id]?'Unlike':'Like \u2665')+'</button>';
  if(!own)items+='<button onclick="menuAct(\'dm\',\''+id+'\',\''+from+'\')">Message '+from+'</button>';
  /* A moderator of this station's rooms (XPRS.md 10.10), on a room message. */
  if(!own&&myStationRole==='mod'&&curRoom.slice(0,3)!=='dm:'){
    items+='<div class="modsep">Moderator</div>'+
      '<button onclick="menuAct(\'mdel\',\''+id+'\',\''+from+'\')">Delete for everyone</button>'+
      '<button onclick="menuAct(\'mout1\',\''+id+'\',\''+from+'\')">Send '+from+' away for an hour</button>'+
      '<button onclick="menuAct(\'mout24\',\''+id+'\',\''+from+'\')">Send '+from+' away for a day</button>'+
      '<button onclick="menuAct(\'mout\',\''+id+'\',\''+from+'\')">Send '+from+' away until lifted</button>';
  }
  m.innerHTML=items;
  m.style.display='block';
  var x=Math.min(ev.clientX,window.innerWidth-180);
  var y=Math.min(ev.clientY,window.innerHeight-140);
  m.style.left=x+'px';m.style.top=y+'px';
  ev.stopPropagation();}
document.addEventListener('click',function(){
  document.getElementById('msgmenu').style.display='none';});
function menuAct(act,id,from){
  document.getElementById('msgmenu').style.display='none';
  if(act==='reply')startReply(id);
  else if(act==='like')sendLike(id);
  else if(act==='dm')openDm(from);
  else if(act==='mdel')modDelete(id);
  else if(act==='mout1')modSendAway(from,3600);
  else if(act==='mout24')modSendAway(from,86400);
  else if(act==='mout')modSendAway(from,0);}

var clearedBefore=parseInt(stGet('xprs_cleared')||'0',10)||0;

/* Rooms (XPRS.md 9.11): Local is the scope:local conversation, kept to
 * Bluetooth, ESP-NOW and the LAN; Regional is scope:regional, which adds
 * LoRa and radio and never reaches the internet; Global is the default
 * scope, which goes anywhere. A room is the scope its author wrote, never
 * the bearer that delivered it, and a packet the station heard out of range
 * (row.out) is in none of them. A packet with d: naming a person is a 1:1
 * and gets its own room. */
/* Local, every time the page opens. It used to come back to the room last
   used, but the captive-portal WebView gives every station's hotspot the
   same origin (connectivitycheck.gstatic.com), so a room chosen on one
   station's page followed the visitor to the next: Regional on a dongle
   because of an afternoon on another board. The room the visitor is
   standing in is the one to start in. */
var curRoom='local';
var allRows=[];              /* every row heard, for room switches */
var dmPeers={};              /* callsign -> true */
function baseCall(c){var i=c.indexOf('-');return i<0?c:c.slice(0,i);}
/* The scope word before m:, as the room it files into. An unknown lowercase
 * word is in no room: a station does not pass it on (9.11). */
function scopeRoom(w){
  var m=w.split(' m:')[0].match(/ scope:(\S+)/);
  if(!m||m[1]==='global')return 'global';
  if(m[1]==='local'||m[1]==='regional')return m[1];
  return /[a-z]/.test(m[1])?null:'global';      /* PT,ES: a country */
}
function roomOf(row){
  var w=row.wire||'';
  var to=row.to||'';
  if(row.out)return null;
  /* A status (27) is a feed post, not a conversation: its own timeline. */
  if((row.type||'')==='status'||w.indexOf('t:status ')===0)return 'social';
  /* A post (18) is listed by the Blog feed as a card, never as a bubble. */
  if((row.type||'')==='blog'||w.indexOf('t:blog ')===0)return null;
  if(to&&hostedByCall[baseCall(to)])return 'g:'+baseCall(to);
  if(to&&to[0]!=='#'){
    if(baseCall(to)===baseCall(mycall))return 'dm:'+baseCall(row.from);
    if(baseCall(row.from)===baseCall(mycall))return 'dm:'+baseCall(to);
    return null;             /* somebody else's 1:1: not our room */
  }
  return scopeRoom(w);
}
function roomLabel(r){
  if(r==='alerts')return 'Alerts';
  if(r==='blog')return 'Blog';
  if(r.slice(0,2)==='f:'){var fr=hostedByCall[r.slice(2)];return fr?fr.name:r.slice(2);}
  if(r==='dmnew')return 'Private message';
  if(r.slice(0,2)==='g:'){var hr=hostedByCall[r.slice(2)];return hr?hr.name:r.slice(2);}
  return r==='local'?'Local':r==='regional'?'Regional':r==='global'?'Global':
         r==='social'?'Social':r.slice(3);}
/* The drawer on a narrow screen (the CSS decides when #side is one). */
function toggleSide(){var o=!el('side').classList.contains('open');el('side').className=o?'open':'';el('sidebg').className=o?'open':'';}
function closeSide(){el('side').className='';el('sidebg').className='';}
function drawRoomBar(){
  var n=0,k;for(k in dmUnread)if(dmUnread[k])n++;
  var b=el('rb-name'),c=el('rb-cnt');if(!b)return;
  b.textContent=curRoom==='forum'?'Forum':roomLabel(curRoom);
  c.style.display=n?'':'none';c.textContent=n;
}
function renderSide(){
  var el=document.getElementById('side');
  var htmlp='<div class="roomhead">Chat</div>';
  var rooms=['local','regional','global'];
  /* Whoever wrote and was not read yet comes first. */
  var peers=Object.keys(dmPeers).sort(function(a,b){
    return ((dmUnread[b]?1:0)-(dmUnread[a]?1:0))||(a<b?-1:a>b?1:0);});
  var extra='<div class="roomhead">People</div>'+
    '<div class="room new'+(curRoom==='dmnew'?' on':'')+'" data-r="dmnew">+ Private message</div>';
  /* Rooms this station hosts (XPRS.md 10.10.1): the ones we may see. */
  function roomEntries(list,prefix){return list.map(function(hr){var k=prefix+hr.call;
      return '<div class="room'+(curRoom===k?' on':'')+'" data-r="'+k+'">'+esc(hr.name)+
        (hr.visibility==='private'?'<span class="lock" title="private: members only">&#128274;</span>':'')+
        '</div>';}).join('');}
  var chatRooms=hostedRooms.filter(function(hr){return hr.kind!=='forum'&&hr.kind!=='mesh'&&!GAL_KINDS[hr.kind];});
  var hosted=chatRooms.length?'<div class="roomhead">Station rooms</div>'+roomEntries(chatRooms,'g:'):'';
  /* The Forum (XPRS.md 18.5) is always on the list: its categories are the
   * station's forum rooms, shown inside, and a category open keeps it lit. */
  var forum='<div class="room'+(curRoom==='forum'||curRoom.slice(0,2)==='f:'?' on':'')+
      '" data-r="forum">Forum</div>';
  /* Gallery, Music, Library: on every station, disabled where there is no
   * storage (page.storage). */
  for(var gk in GAL_KINDS)forum+='<div class="room'+(curRoom===gk?' on':'')+(canGallery?'':' off')+'" data-r="'+gk+'"'+
    (canGallery?'':' title="Needs storage: a computer, or a board with a memory card"')+'>'+GAL_KINDS[gk].name+'</div>';
  el.innerHTML=htmlp+
    rooms.map(function(r){return '<div class="room'+(curRoom===r?' on':'')+
      '" data-r="'+r+'">'+roomLabel(r)+'</div>';}).join('')+
    '<div class="roomhead">Feed</div>'+
    '<div class="room'+(curRoom==='social'?' on':'')+
      '" data-r="social">Social</div>'+
    '<div class="room'+(curRoom==='alerts'?' on':'')+'" data-r="alerts" id="alertsroom">'+
      alertsLabel()+'</div>'+
    '<div class="room'+(curRoom==='blog'?' on':'')+'" data-r="blog" id="blogroom">'+
      blogLabel()+'</div>'+
    forum+hosted+extra+

/* Rooms the station keeps from visitors outside its network. */

/* Draw the room again from what was heard (a key arrived, so what was held

function rerender(){

// ---- unread private messages ------------------------------------------------
//
// One counter per person: messages from them newer than when this browser last
// had their conversation open. "Read" is kept per origin, so a reload does not
// bring old mail back as new; a browser that never read anybody starts from
// its first visit, not from the whole archive.
var dmUnread={},dmCounted={},dmRead={};
try{var _dr=stGet('xprs_dm_read');if(_dr)dmRead=JSON.parse(_dr);}catch(e){}
var dmSince=parseInt(stGet('xprs_dm_since')||'0',10);
if(!dmSince){dmSince=Math.floor(Date.now()/1000);stSet('xprs_dm_since',''+dmSince);}
function countDm(peer,row){
  if(baseCall(row.from||'')===baseCall(mycall))return;      /* ours */
  var id=wireId(row.wire||'');
  if(dmCounted[id])return;
  dmCounted[id]=1;
  var ts=row.ts||0;
  if(ts<=(dmRead[peer]||dmSince))return;
  if(tab==='chat'&&curRoom==='dm:'+peer){markDmRead(peer);return;}
  dmUnread[peer]=(dmUnread[peer]||0)+1;

function markDmRead(peer){
  var now=Math.floor(Date.now()/1000);

  if((dmRead[peer]||0)<now){dmRead[peer]=now;stSet('xprs_dm_read',JSON.stringify(dmRead));}
}
function openDm(call){
  var p=baseCall(call);
  if(p===baseCall(mycall))return;
  dmPeers[p]=true;
  if(tab!=='chat')showTab('chat');
  switchRoom('dm:'+p);
}

// ---- private messages -------------------------------------------------------
//
// Sealed to the peer's key by default (XPRS.md 6.2); a conversation may be

// started from a callsign (the key is looked up from its verified identity)
// or from an npub, which is the key itself: its X1 callsign derives from it.

    'stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/>'+
    (c?'<path d="M8 11V7a4 4 0 0 1 7.5-1.9"/>':'<path d="M8 11V7a4 4 0 0 1 8 0v4"/>')+'</svg>';
  b.title=c?'Clear text: anyone can read it. Tap to seal':'Sealed: only '+peer+' can read it. Tap for clear text';

function toggleSeal(){

  stSet('xprs_dm_clear',JSON.stringify(dmClear));

/* Who is active in the chat: authors heard recently, newest first. */
function activeCalls(){
  var seenC={},out=[],i,c;
  for(i=allRows.length-1;i>=0&&out.length<24;i--){
    c=baseCall(allRows[i].from||'');
    if(!c||c===baseCall(mycall)||seenC[c]||c===stationCall)continue;
    seenC[c]=1;out.push(c);
  }

}
function dmNewCard(){
  var a=activeCalls(),h='<div class="card" id="dmnew"><h4>Private message</h4>'+
    '<p class="lead">A callsign active on this chat, or an npub.</p>'+
    '<div class="frow"><input id="dm-to" class="grow" placeholder="Callsign or npub1&hellip;" '+
    'onkeydown="if(event.key===\'Enter\')startDm()">'+
    '<button class="act primary" onclick="startDm()">Write</button></div>';
  if(a.length){
    h+='<div class="chips">';

    h+='</div>';
  }

    'The lock beside the message box switches a conversation to clear text, for amateur radio.</p></div>';
