name: encrypted_archive
description: >
  A high-performance encrypted archive format using zxdb (package:zx) for storage.
  Supports streaming, incremental updates, and terabyte-scale archives
  with per-chunk encryption and optional deduplication.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  zx:                    # zxdb, the pure-Dart SQL database the archive lives in
    git:
      url: https://github.com/x1watt/zx.git
      ref: 4ec20db8176b09c32172a66a40cfacbad12cb469
  cryptography: ^2.7.0
  crypto: ^3.0.3
  archive: ^3.4.0
  meta: ^1.9.0
  path: ^1.8.0
  pointycastle: ^3.9.1   # sync AES-GCM for the sync read/write API (WASM HAL callbacks)


dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
