name: test

# Runs the app's unit tests on every push/PR. The app depends on
# reticulum-dart and core through path dependencies (../reticulum-dart,
# ../core), and they on zx (../../x1watt/zx); tool/ci_fetch_siblings.sh clones
# them before packages are resolved.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch reticulum-dart, core and zx (path dependencies)
        shell: bash
        run: tool/ci_fetch_siblings.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Test
        run: |
          flutter pub get
          flutter test
