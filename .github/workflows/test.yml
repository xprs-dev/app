name: test

# Runs the Aurora unit tests on every push/PR (the content-transfer, folder,
# media-archive and update suites). Aurora depends on reticulum-dart and core
# through path dependencies (../reticulum-dart, ../core), so we check those
# repos out as siblings before resolving packages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xprs
        uses: actions/checkout@v4
        with:
          path: xprs

      - name: Checkout reticulum-dart (path dependency)
        uses: actions/checkout@v4
        with:
          repository: xprs-dev/reticulum-dart
          ref: pure-dart
          path: reticulum-dart

      - name: Checkout core (path dependency)
        uses: actions/checkout@v4
        with:
          repository: xprs-dev/core
          ref: core-move
          path: core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test
        working-directory: xprs
        run: |
          flutter pub get
          flutter test
