name: build-android

# CI build verification only. Tag releases are built + published to
# xprs.dev by release.yml (no GitHub release attach here).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      # Full history: the build number is the commit count, and a
      # depth-1 clone makes that 1 (see release.yml).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pubspec.yaml has a path dependencies on ../reticulum-dart and ../core;
      # clone them next to
      # the workspace so pub get (incl. flutter-action's setup) can resolve it.
      - name: Fetch reticulum-dart and core (path dependencies)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/xprs-dev/reticulum-dart.git ../reticulum-dart
          git clone --depth 1 -b permissions https://github.com/xprs-dev/core.git ../core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version + build number
        run: |
          # versionCode = git commit count so it always increases.
          CODE=$(git rev-list --count HEAD)
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          # For a tag build, use the tag (vX.Y.Z) as the version name.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          sed -i "s/^version:.*/version: ${VER}+${CODE}/" pubspec.yaml
          dart run tool/update_version.dart

      - run: flutter pub get
      # Retried: the Gradle distribution download (GitHub releases) has been
      # answering 504 intermittently.
      - run: |
          for i in 1 2 3 4 5; do
            flutter build apk --release && exit 0
            echo "build attempt $i failed; retrying in 60 s"; sleep 60
          done
          exit 1

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/xprs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xprs-android
          path: dist/xprs.apk
