name: build-android

# CI build verification only. Tag releases are built + published to
# xprs.dev by release.yml (no GitHub release attach here).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      # Full history: the build number is the commit count, and a
      # depth-1 clone makes that 1 (see release.yml).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pubspec.yaml has a path dependencies on ../reticulum-dart and ../core;
      # clone them next to
      # the workspace so pub get (incl. flutter-action's setup) can resolve it.
      - name: Fetch reticulum-dart, core and zx (path dependencies)
        shell: bash
        run: tool/ci_fetch_siblings.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Sync version + build number
        run: |
          # versionCode = git commit count so it always increases.
          CODE=$(git rev-list --count HEAD)
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          # For a tag build, use the tag (vX.Y.Z) as the version name.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          sed -i "s/^version:.*/version: ${VER}+${CODE}/" pubspec.yaml
          dart run tool/update_version.dart

      # Signed with the XPRS release key (docs/f-droid.md §5), the same one
      # release.yml uses, so a CI build installs over a release and over the
      # build before it. Without the secrets (a fork) gradle falls back to
      # debug signing and the build still runs.
      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::no release keystore: debug-signed APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/xprs.apk

      - uses: actions/upload-artifact@v4
        with:
          name: xprs-android
          path: dist/xprs.apk
