name: build-web

# The browser build compiles the same lib/ to WebAssembly (dart2wasm, --wasm:
# the stores need 64-bit integers) with a JavaScript fallback (dart2js), and it
# is the one target where an unconditional dart:ffi import is a hard compile
# error rather than a runtime throw. This job exists so that error is found
# here, not on the next person who runs launch-web.sh (docs/web.md). It needs
# more memory than a Raspberry Pi has: the two compilers run at once and
# wasm-opt alone takes ~1.6 GB.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml has a path dependencies on ../reticulum-dart and ../core;
      # clone them next to
      # the workspace so pub get can resolve it.
      - name: Fetch reticulum-dart, core and zx (path dependencies)
        shell: bash
        run: tool/ci_fetch_siblings.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter build web --wasm --release --no-tree-shake-icons --pwa-strategy=none

      - uses: actions/upload-artifact@v4
        with:
          name: xprs-web
          path: build/web
