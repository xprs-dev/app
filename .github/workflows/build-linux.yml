name: build-linux

# CI build verification only. Tag releases are built + published to
# xprs.dev by release.yml (no GitHub release attach here).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    # Pinned: on ubuntu-26.04 (ubuntu-latest from 2026-10-21) the Linux link
    # fails, while the same tree links on 24.04. arm64 is for the Raspberry
    # Pi class of machine (a station's server, a bench), built natively on
    # GitHub's arm64 runner rather than cross-compiled.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Full history: the build number is the commit count, and a
      # depth-1 clone makes that 1 (see release.yml).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pubspec.yaml has a path dependencies on ../reticulum-dart and ../core;
      # clone them next to
      # the workspace so pub get (incl. flutter-action's setup) can resolve it.
      - name: Fetch reticulum-dart, core and zx (path dependencies)
        shell: bash
        run: tool/ci_fetch_siblings.sh

      # The runner image ships package lists; `apt-get update` first has hung
      # for an hour on a slow mirror, so try without it, refresh only if the
      # install fails, and never wait past the step's timeout.
      - name: Install Linux build deps
        timeout-minutes: 15
        run: |
          PKGS="clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev"
          APT="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $APT install -y --no-install-recommends $PKGS || {
            timeout 300 $APT update
            $APT install -y --no-install-recommends $PKGS
          }

      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          cache: true

      # Flutter publishes no prebuilt Linux arm64 SDK, which is what the
      # action downloads; the stable branch from git is what an arm64 machine
      # (this project's Raspberry Pi) runs anyway.
      - name: Flutter stable from git (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone -q --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" --disable-analytics
          "$HOME/flutter/bin/flutter" precache --linux

      - name: Sync version
        run: |
          CODE=$(git rev-list --count HEAD)
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then VER="${GITHUB_REF_NAME#v}"; fi
          sed -i "s/^version:.*/version: ${VER}+${CODE}/" pubspec.yaml
          dart run tool/update_version.dart

      - run: flutter pub get
      - run: flutter build linux --release

      - name: Package portable bundle
        run: |
          mkdir -p dist
          # Tar the *contents* of the bundle (xprs, data/, lib/ at top level)
          # so apply-update.sh can swap them in place. Reproducible flags.
          tar -C build/linux/${{ matrix.arch }}/release/bundle \
            --sort=name --owner=0 --group=0 --mtime='1970-01-01' \
            -czf dist/xprs-linux-${{ matrix.arch }}.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: xprs-linux-${{ matrix.arch }}
          path: dist/xprs-linux-${{ matrix.arch }}.tar.gz
