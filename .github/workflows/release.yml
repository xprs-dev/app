name: release

# Build the Android / Linux / Windows artifacts on a version tag and attach them
# to a GitHub Release on THIS repo as assets (NOT committed to git, so the source
# repo stays lean). xprs-dev/downloads then serves them on xprs.dev/downloads,
# and the website repo's sync.yml hashes them into the update feed
# (stable.json/beta.json). The app fetches a binary by sha256 over Reticulum,
# and from xprs.dev only when no station holds it.
#
# Android is built the way F-Droid builds it, inside F-Droid's buildserver
# image, from the recipe in fdroid/ (fdroid/buildserver-build.sh). F-Droid
# rebuilds the same recipe and ships these very APKs, signed by us, only when
# its build is identical: a reproducible build. See docs/f-droid.md.
#
# Every job builds the version pubspec.yaml carries at the tag (release.sh wrote
# it, and lib/version.dart with it), with ../reticulum-dart at the commit
# .reticulum-dart-commit pins. Nothing is rewritten here: F-Droid cannot rewrite
# anything either, and the two builds have to agree.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      commit:
        description: 'Android: build this commit instead of the branch head (re-checks that an older build reproduces)'
        required: false

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
    # Hoisted to job level so a step's `if` can gate on it: the `secrets`
    # context is not allowed in a step-level `if`, only `env` is.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag names the version pubspec.yaml carries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          test "$VER" = "${GITHUB_REF_NAME#v}" ||
            { echo "::error::pubspec.yaml says $VER, the tag says $GITHUB_REF_NAME"; exit 1; }
      # The buildserver image, the Flutter and NDK it downloads and the build
      # itself need ~25 GB; the runner's preinstalled SDKs are not used.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Render the F-Droid recipe for this commit
        run: python3 tool/fdroid_recipe.py --no-binary --commit "${{ inputs.commit || github.sha }}" --out "$RUNNER_TEMP/recipe"
      # fdroidserver clones this repository at that commit and builds it; the
      # checkout above only provides the recipe and the script.
      - name: Build in F-Droid's buildserver image, sign, verify
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          CODE=$(python3 tool/fdroid_recipe.py --print-vercode ${{ matrix.abi }})
          mkdir -p dist "$RUNNER_TEMP/keys"
          sign=()
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
            sign=(-e KEYSTORE=/keys/release.jks -e KEY_ALIAS -e KS_PASS -e KEY_PASS
                  -e SIGNED_NAME="xprs-$VER-android-${{ matrix.abi }}.apk")
          else
            echo "::warning::no release keystore: unsigned APK only"
          fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/recipe:/recipe:ro" \
            -v "$RUNNER_TEMP/keys:/keys:ro" -v "$GITHUB_WORKSPACE/dist:/out" \
            -e BUILD="com.xprs.app:$CODE" -e RECIPE=/recipe "${sign[@]}" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /src/fdroid/buildserver-build.sh
          rm -rf "$RUNNER_TEMP/keys"
          ls -lR dist
      # The signed APK is the release asset; unsigned/ is F-Droid's view of it,
      # kept for comparing against another build.
      - uses: actions/upload-artifact@v4
        with:
          name: xprs-android-${{ matrix.abi }}
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reticulum-dart at the pinned commit (path dependency)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/xprs-dev/reticulum-dart.git ../reticulum-dart
          git -C ../reticulum-dart checkout -q "$(cat .reticulum-dart-commit)"
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: The tag names the version pubspec.yaml carries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          test "$VER" = "${GITHUB_REF_NAME#v}" ||
            { echo "::error::pubspec.yaml says $VER, the tag says $GITHUB_REF_NAME"; exit 1; }
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package portable bundle
        run: |
          mkdir -p dist
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          tar -C build/linux/x64/release/bundle \
            --sort=name --owner=0 --group=0 --mtime='1970-01-01' \
            -czf "dist/xprs-$VER-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: xprs-linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reticulum-dart at the pinned commit (path dependency)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/xprs-dev/reticulum-dart.git ../reticulum-dart
          git -C ../reticulum-dart checkout -q "$(cat .reticulum-dart-commit)"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: The tag names the version pubspec.yaml carries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          test "$VER" = "${GITHUB_REF_NAME#v}" ||
            { echo "::error::pubspec.yaml says $VER, the tag says $GITHUB_REF_NAME"; exit 1; }
      - run: flutter pub get
      # wasm_run_flutter's CMake downloads a native runtime tarball and extracts
      # it with `cmake -E tar` (libarchive), but the extract path runs through the
      # .plugin_symlinks/wasm_run_flutter symlink — libarchive refuses to extract
      # through a symlink, failing the build. Its CMake skips the download+extract
      # when the DLL already exists, so pre-extract it into the REAL pub-cache
      # location (no symlink in that path); CMake's EXISTS check then resolves
      # through the symlink, finds it, and skips its own broken extraction.
      - name: Pre-fetch wasm_run native runtime (avoid CMake extract-through-symlink)
        shell: bash
        run: |
          set -euo pipefail
          # wasm_run_flutter is vendored (third_party/, a path override), so it
          # is not in the pub cache. Windows still uses upstream's prebuilt
          # library; Android and Linux build it from source.
          PLUGIN=third_party/wasm_run_flutter/windows
          VER=$(grep -oE 'wasm_run-v[0-9.]+' "$PLUGIN/CMakeLists.txt" | head -1)
          LIBROOT="$PLUGIN/$VER"
          if [ ! -f "$LIBROOT/windows-x64/wasm_run_dart.dll" ]; then
            mkdir -p "$LIBROOT"
            curl -fL -o "$PLUGIN/$VER.tar.gz" \
              "https://github.com/juancastillo0/wasm_run/releases/download/$VER/other.tar.gz"
            tar -xzf "$PLUGIN/$VER.tar.gz" -C "$LIBROOT"
          fi
          ls -la "$LIBROOT/windows-x64/"
      # MSVC 14.51 (VS 2022 18.x on windows-latest) turns <experimental/coroutine>
      # into a hard error (STL1011); several BLE/permission plugins still include
      # it. CL prepends this define to every cl.exe call so the plugins compile.
      - run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - name: Build Inno Setup installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\xprs.iss
      - uses: actions/upload-artifact@v4
        with:
          name: xprs-windows
          path: build/installer/*-setup.exe

  publish:
    # Wait for all three so the Windows installer is attached when its build is
    # green, but only REQUIRE Android + Linux: a Windows failure must never block
    # shipping them (its build has been fragile — wasm_run_flutter plugin symlinks).
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.android.result == 'success' && needs.linux.result == 'success' }}
    permissions:
      contents: write        # create a GitHub Release on THIS repo (no secret)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p dist
          cp artifacts/xprs-android-*/*.apk dist/
          cp artifacts/xprs-linux/*.tar.gz dist/
          # Windows is optional (see the publish job's needs) — attach it only if
          # its job produced the installer this run.
          if compgen -G 'artifacts/xprs-windows/*-setup.exe' > /dev/null; then
            cp artifacts/xprs-windows/*-setup.exe dist/
          else
            echo "::warning::Windows installer not built this run — publishing Android + Linux only."
          fi
      # Publish the binaries as GitHub Release assets — NOT committed to git, so
      # the source repo stays lean. xprs-dev/downloads copies them to
      # xprs.dev/downloads, and F-Droid fetches the Android ones from here to
      # compare with its own build (the recipe's binary: URLs).
      - name: Create GitHub Release with binaries as assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
