name: architecture

# The rules in docs/architecture.md, checked. They exist because the same two
# mistakes keep coming back months apart — transport logic drifting into a wapp,
# and blocking work landing on the UI isolate — and neither is visible in review
# because the feature works.
#
# Only NEW violations fail: what already exists is recorded in
# tool/arch_baseline.txt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  arch-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xprs
        uses: actions/checkout@v4
        with:
          path: xprs

      # The wapp-side rules only run when the apps repo is present; without it
      # the guard silently checks less, so check it out.
      - name: Checkout apps (wapp-side rules)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: xprs-dev/apps
          path: apps

      # The web-build rule is also checked in reticulum-dart (a path dependency
      # of the app); without the sibling the guard silently checks less.
      - name: Library branch
        id: libref
        shell: bash
        run: |
          b="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/xprs-dev/reticulum-dart.git "$b" >/dev/null 2>&1; then
            echo "ref=$b" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout reticulum-dart (sibling rules)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: xprs-dev/reticulum-dart
          path: reticulum-dart
          # The library branch of the same name when there is one, else main
          # (resolved in the step before).
          ref: ${{ steps.libref.outputs.ref }}

      - uses: dart-lang/setup-dart@v1

      - name: Architecture guard
        working-directory: xprs
        run: dart tool/arch_guard.dart
